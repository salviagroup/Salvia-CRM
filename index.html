                mostrarToast('💾 Backup exportado (contas + caixa)');
            };

            const importarBackup = async (file) => {
                if (!file) return;
                try {
                    const txt = await file.text();
                    const dados = JSON.parse(txt);
                    if (!dados.contas) throw new Error('formato');
                    if (!window.confirm('Substituir os dados atuais pelos do backup? Essa ação não pode ser desfeita.')) return;
                    setContas(dados.contas);
                    if (dados.caixa) setCaixa(dados.caixa);
                    if (dados.categorias) setCategoriasCustom(dados.categorias);
                    if (dados.receber) setReceber(dados.receber);
                    if (dados.regras) setRegras(dados.regras);
                    if (dados.fechados) setMesesFechados(dados.fechados);
                    if (dados.tipos) setTiposCustom(dados.tipos);
                    mostrarToast('💾 Backup restaurado');
                } catch (e) {
                    mostrarToast('⚠️ Arquivo de backup inválido');
                }
            };

            /* ── Dados derivados ── */
            const contasEmpresa = contas[empresa] || [];
            const ehSilxan = empresa === 'silxan';
            const nomeEmpresa = ehSilxan ? 'Silxan' : 'Sálvia';
            const emojiTema = ehSilxan ? '💗' : '🌿';

            const mesmoMes = (c, ref) => {
                const iso = paraISO(c.vencimento);
                if (!iso) return true;
                const [a, m] = iso.split('-').map(Number);
                return a === ref.getFullYear() && m === ref.getMonth() + 1;
            };

            const contasDoMes = useMemo(() => contasEmpresa.filter((c) => mesmoMes(c, mesAtual)), [contasEmpresa, mesAtual]);

            const totalPago = contasDoMes.filter((c) => c.status === 'pago').reduce((s, c) => s + valorEfetivo(c), 0);
            const totalPendente = contasDoMes.filter((c) => c.status !== 'pago').reduce((s, c) => s + c.valor, 0);
            const vencidas = contasDoMes.filter(estaVencida);
            const totalVencido = vencidas.reduce((s, c) => s + c.valor, 0);
            const totalMes = totalPago + totalPendente;
            const jurosDoMes = contasDoMes.reduce((s, c) => s + (c.juros || 0), 0);

            const diasComContas = useMemo(() => {
                const dias = new Set();
                contasDoMes.forEach((c) => {
                    const iso = paraISO(c.vencimento);
                    if (iso) dias.add(iso.split('-')[2]);
                });
                return [...dias].sort();
            }, [contasDoMes]);

            const contasMesFiltradasDia = useMemo(() => {
                let lista = contasDoMes;
                if (filtroDia !== 'todos') lista = lista.filter((c) => paraISO(c.vencimento).split('-')[2] === filtroDia);
                return [...lista].sort((a, b) => (paraISO(a.vencimento) || '9999').localeCompare(paraISO(b.vencimento) || '9999'));
            }, [contasDoMes, filtroDia]);

            /* ── Busca e filtros do Início ── */
            const [buscaInicio, setBuscaInicio] = useState('');
            const [filtroInicio, setFiltroInicio] = useState('todas');
            const [buscaTodoPeriodo, setBuscaTodoPeriodo] = useState(false);

            const contasInicio = useMemo(() => {
                const q = buscaInicio.trim().toLowerCase();
                // Com busca ativa + "todos os meses", procura no histórico inteiro
                let lista = (q && buscaTodoPeriodo) ? contasEmpresa : contasMesFiltradasDia;
                if (q) {
                    const qNum = q.replace(/[^\d,.]/g, '').replace(',', '.');
                    lista = lista.filter((c) => {
                        const texto = (c.fornecedor + ' ' + (c.categoria || '') + ' ' + (tipoInfo(c.tipo) ? tipoInfo(c.tipo).label : '')).toLowerCase();
                        if (texto.includes(q)) return true;
                        // Busca por valor: "1050", "1.050" ou "1050,00" acham R$ 1.050,00
                        if (qNum && qNum.length >= 2) {
                            const soDigitos = q.replace(/[^\d]/g, '');
                            const vStr = String(arred(valorEfetivo(c)));
                            const vDigitos = fmtValor(valorEfetivo(c)).replace(/[^\d]/g, '');
                            if (vStr.startsWith(qNum) || (soDigitos.length >= 2 && vDigitos.startsWith(soDigitos))) return true;
                        }
                        return false;
                    });
                }
                if (filtroInicio === 'pendentes') lista = lista.filter((c) => c.status !== 'pago' && !estaVencida(c));
                else if (filtroInicio === 'vencidas') lista = lista.filter(estaVencida);
                else if (filtroInicio === 'pagas') lista = lista.filter((c) => c.status === 'pago');
                return [...lista].sort((a, b) => (paraISO(a.vencimento) || '9999').localeCompare(paraISO(b.vencimento) || '9999'));
            }, [contasMesFiltradasDia, contasEmpresa, buscaInicio, filtroInicio, buscaTodoPeriodo]);

            const contasFiltradas = useMemo(() => {
                let lista = contasDoMes;
                if (filtroStatus === 'pendentes') lista = lista.filter((c) => c.status !== 'pago');
                if (filtroStatus === 'pagas') lista = lista.filter((c) => c.status === 'pago');
                if (filtroStatus === 'vencidas') lista = lista.filter(estaVencida);
                if (busca.trim()) {
                    const q = busca.toLowerCase();
                    lista = lista.filter((c) => (c.fornecedor + ' ' + (c.categoria || '')).toLowerCase().includes(q));
                }
                return [...lista].sort((a, b) => (paraISO(a.vencimento) || '9999').localeCompare(paraISO(b.vencimento) || '9999'));
            }, [contasDoMes, filtroStatus, busca]);

            const fornecedores = useMemo(() => {
                return [...new Set(contasEmpresa.map((c) => c.fornecedor))].sort((a, b) => a.localeCompare(b));
            }, [contasEmpresa]);

            /* ── CRUD ── */
            const abrirNovaConta = () => {
                setEditandoId(null);
                setForm({ ...FORM_VAZIO, vencimento: hojeISO() });
                setBoletoFile(null);
                setDadosExtraidos(null);
                setErroBoleto('');
                setModalAberto(true);
            };

            const abrirEdicao = (c) => {
                if (bloqueadoPorFechamento(paraISO(c.vencimento))) return;
                setEditandoId(c.id);
                setForm({
                    fornecedor: c.fornecedor,
                    valor: String(c.valor),
                    vencimento: paraISO(c.vencimento),
                    categoria: c.categoria || '',
                    status: c.status,
                    linhaDigitavel: c.linhaDigitavel || '',
                    recorrente: !!c.recorrente,
                    tipo: c.tipo || 'fornecedor',
                    apelidos: c.apelidos || '',
                    repeticao: c.recorrente ? 'mensal' : (c.parcelaTotal ? 'parcelada' : 'nenhuma'),
                    parcelas: String(c.parcelaTotal || 2),
                });
                setBoletoFile(null);
                setDadosExtraidos(null);
                setErroBoleto('');
                setModalAberto(true);
            };

            const salvarConta = async () => {
                if (!form.fornecedor || !form.valor || !form.vencimento) {
                    mostrarToast('⚠️ Preencha fornecedor, valor e vencimento');
                    return;
                }
                let boletoId = null, boletoNome = null;
                if (boletoFile) {
                    boletoId = 'bol-' + Date.now();
                    boletoNome = boletoFile.name;
                    try {
                        await salvarArquivoIDB({ id: boletoId, nome: boletoFile.name, tipo: boletoFile.type, tamanho: boletoFile.size, blob: boletoFile });
                    } catch (e) {
                        mostrarToast('⚠️ Não foi possível salvar o anexo');
                        boletoId = null;
                    }
                }
                const base = {
                    fornecedor: form.fornecedor.trim(),
                    valor: parseFloat(String(form.valor).replace(',', '.')),
                    vencimento: form.vencimento,
                    categoria: form.categoria,
                    status: form.status,
                    linhaDigitavel: form.linhaDigitavel || undefined,
                    recorrente: form.repeticao === 'mensal',
                    tipo: form.tipo || 'fornecedor',
                    apelidos: (form.apelidos || '').trim() || undefined,
                };
                if (editandoId) {
                    const novas = contasEmpresa.map((c) => {
                        if (c.id !== editandoId) return c;
                        const atualizada = { ...c, ...base, ...(boletoId ? { boletoId, boletoNome } : {}) };
                        if (base.recorrente && !atualizada.serieId) atualizada.serieId = 'ser-' + Date.now();
                        if (base.status !== 'pago') {
                            // Voltou para pendente/extraído: limpa o registro de pagamento
                            delete atualizada.valorPago;
                            delete atualizada.juros;
                            delete atualizada.pagaEm;
                            delete atualizada.diasAtraso;
                        } else if (atualizada.valorPago == null) {
                            // Marcada como paga direto na edição, sem tela de pagamento
                            atualizada.valorPago = base.valor;
                            atualizada.juros = 0;
                            atualizada.pagaEm = hojeISO();
                        }
                        return atualizada;
                    });
                    setContas({ ...contas, [empresa]: novas });
                    mostrarToast('✏️ Conta atualizada');
                } else {
                    const nParcelas = form.repeticao === 'parcelada' ? Math.max(2, Math.min(60, parseInt(form.parcelas, 10) || 2)) : 1;
                    let proxId = Math.max(0, ...contasEmpresa.map((c) => c.id));
                    if (nParcelas > 1) {
                        // Parcelamento: gera todas as parcelas de uma vez
                        const grupoId = 'par-' + Date.now();
                        const [a0, m0, d0] = form.vencimento.split('-').map(Number);
                        const novas = [];
                        for (let i = 0; i < nParcelas; i++) {
                            let a = a0, m = m0 + i;
                            while (m > 12) { m -= 12; a++; }
                            const diasNoMes = new Date(a, m, 0).getDate();
                            const venc = `${a}-${String(m).padStart(2, '0')}-${String(Math.min(d0, diasNoMes)).padStart(2, '0')}`;
                            novas.push({
                                id: ++proxId,
                                ...base,
                                recorrente: false,
                                vencimento: venc,
                                status: i === 0 ? base.status : 'pendente',
                                parcelaNum: i + 1,
                                parcelaTotal: nParcelas,
                                grupoParcela: grupoId,
                                ...(i === 0 && boletoId ? { boletoId, boletoNome } : {}),
                                criadaEm: hojeISO(),
                            });
                        }
                        setContas({ ...contas, [empresa]: [...contasEmpresa, ...novas] });
                        mostrarToast(`✅ ${nParcelas} parcelas criadas de R$ ${fmtValor(base.valor)}`);
                        setModalAberto(false);
                        return;
                    }
                    const nova = {
                        id: proxId + 1,
                        ...base,
                        ...(base.recorrente ? { serieId: 'ser-' + Date.now() } : {}),
                        ...(boletoId ? { boletoId, boletoNome } : {}),
                        criadaEm: hojeISO(),
                    };
                    setContas({ ...contas, [empresa]: [...contasEmpresa, nova] });
                    mostrarToast('✅ Conta adicionada');
                }
                setModalAberto(false);
            };

            const excluirConta = async (c) => {
                if (bloqueadoPorFechamento(paraISO(c.vencimento))) return;
                // Conta recorrente: abre escolha (só esta / parar série)
                if (c.serieId) {
                    setExclusaoConta(c);
                    return;
                }
                if (!window.confirm(`Excluir a conta "${c.fornecedor}" (R$ ${fmtValor(c.valor)})?`)) return;
                if (c.boletoId) { try { await excluirArquivoIDB(c.boletoId); } catch (e) {} }
                setContas({ ...contas, [empresa]: contasEmpresa.filter((x) => x.id !== c.id) });
                mostrarToast('🗑️ Conta excluída');
            };

            const excluirRecorrente = async (c, pararSerie) => {
                if (c.boletoId) { try { await excluirArquivoIDB(c.boletoId); } catch (e) {} }
                const mesConta = paraISO(c.vencimento).slice(0, 7);
                const lista = contasEmpresa
                    .filter((x) => x.id !== c.id)
                    .map((x) => {
                        if (x.serieId !== c.serieId) return x;
                        const at = { ...x };
                        // Carimbo: impede a geração automática de recriar o mês excluído
                        if (!at.serieGeradaAte || at.serieGeradaAte < mesConta) at.serieGeradaAte = mesConta;
                        if (pararSerie) at.recorrente = false;
                        return at;
                    });
                setContas({ ...contas, [empresa]: lista });
                setExclusaoConta(null);
                mostrarToast(pararSerie
                    ? '⏹️ Conta excluída e recorrência encerrada — as pagas ficam no histórico'
                    : '🗑️ Conta excluída — a recorrência continua nos próximos meses');
            };

            /* ── Confirmação de pagamento com juros ── */
            const abrirPagamento = (c) => {
                if (bloqueadoPorFechamento(paraISO(c.vencimento))) return;
                setPgtoConta(c);
                setPgtoComprovante(null);
                setPgtoForm({ valorPago: String(c.valor), dataPagamento: hojeISO() });
            };

            const diasAtraso = (() => {
                if (!pgtoConta || !pgtoForm.dataPagamento) return 0;
                const venc = paraISO(pgtoConta.vencimento);
                if (!venc) return 0;
                const diff = Math.round((new Date(pgtoForm.dataPagamento + 'T12:00') - new Date(venc + 'T12:00')) / 86400000);
                return isNaN(diff) ? 0 : Math.max(0, diff);
            })();
            const valorPagoNum = parseFloat(String(pgtoForm.valorPago).replace(',', '.')) || 0;
            const jurosCalculado = pgtoConta ? Math.max(0, valorPagoNum - pgtoConta.valor) : 0;
            const sugestaoComJuros = pgtoConta && diasAtraso > 0
                ? pgtoConta.valor * (1 + 0.02 + 0.01 * (diasAtraso / 30))
                : null;

            const confirmarPagamento = async () => {
                if (!pgtoConta) return;
                if (!valorPagoNum || valorPagoNum <= 0) {
                    mostrarToast('⚠️ Informe o valor pago');
                    return;
                }
                let comprovanteId = null, comprovanteNome = null, comprovanteDrive = null;
                if (pgtoComprovante) {
                    comprovanteNome = pgtoComprovante.name;
                    comprovanteId = 'comp-' + Date.now();
                    try {
                        await salvarArquivoIDB({ id: comprovanteId, nome: pgtoComprovante.name, tipo: pgtoComprovante.type, tamanho: pgtoComprovante.size, blob: pgtoComprovante });
                    } catch (e) { comprovanteId = null; }
                    if (driveClientId) {
                        try {
                            const nomeDrive = `${pgtoForm.dataPagamento}_${pgtoConta.fornecedor.replace(/[^\wÀ-ú -]/g, '')}_R$${fmtValor(valorPagoNum).replace(/\./g, '')}${pgtoComprovante.name.match(/\.[^.]+$/) ? pgtoComprovante.name.match(/\.[^.]+$/)[0] : ''}`;
                            const resp = await enviarParaDrive(pgtoComprovante, nomeDrive);
                            comprovanteDrive = { id: resp.id, link: resp.webViewLink };
                        } catch (e) {
                            mostrarToast('⚠️ Comprovante salvo no aparelho, mas o envio ao Drive falhou');
                        }
                    }
                }
                setContas({
                    ...contas,
                    [empresa]: contasEmpresa.map((x) =>
                        x.id === pgtoConta.id
                            ? {
                                ...x,
                                status: 'pago',
                                valorPago: valorPagoNum,
                                juros: jurosCalculado > 0.009 ? Math.round(jurosCalculado * 100) / 100 : 0,
                                pagaEm: pgtoForm.dataPagamento,
                                diasAtraso,
                                ...(comprovanteId ? { comprovanteId, comprovanteNome } : {}),
                                ...(comprovanteDrive ? { comprovanteDrive } : {}),
                            }
                            : x
                    ),
                });
                mostrarToast(
                    comprovanteDrive ? '✅ Paga · comprovante enviado ao Drive 📁'
                    : jurosCalculado > 0.009 ? `✅ Paga com R$ ${fmtValor(jurosCalculado)} de juros registrados`
                    : '✅ Conta paga sem juros'
                );
                setPgtoConta(null);
                setPgtoComprovante(null);
            };

            const desfazerPagamento = (c) => {
                if (bloqueadoPorFechamento(paraISO(c.vencimento))) return;
                if (!window.confirm(`Desfazer o pagamento de "${c.fornecedor}"? A conta volta para Pendente e o registro de pagamento é removido.`)) return;
                setContas({
                    ...contas,
                    [empresa]: contasEmpresa.map((x) => {
                        if (x.id !== c.id) return x;
                        const revertida = { ...x, status: 'pendente' };
                        delete revertida.valorPago;
                        delete revertida.juros;
                        delete revertida.pagaEm;
                        delete revertida.diasAtraso;
                        return revertida;
                    }),
                });
                mostrarToast('↩️ Pagamento desfeito — conta pendente novamente');
            };

            const abrirComprovante = async (c) => {
                if (c.comprovanteDrive && c.comprovanteDrive.link) {
                    window.open(c.comprovanteDrive.link, '_blank');
                    return;
                }
                if (c.comprovanteId) {
                    try {
                        const reg = await lerArquivoIDB(c.comprovanteId);
                        if (reg && reg.blob) {
                            const url = URL.createObjectURL(reg.blob);
                            window.open(url, '_blank');
                            setTimeout(() => URL.revokeObjectURL(url), 60000);
                            return;
                        }
                    } catch (e) {}
                }
                mostrarToast('⚠️ Comprovante não encontrado');
            };

            /* ── Extrair boleto ── */
            const extrairBoleto = async (c) => {
                let fezAlgo = false;
                if (c.boletoId) {
                    try {
                        const reg = await lerArquivoIDB(c.boletoId);
                        if (reg && reg.blob) {
                            const url = URL.createObjectURL(reg.blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = reg.nome || 'boleto';
                            document.body.appendChild(a);
                            a.click();
                            a.remove();
                            setTimeout(() => URL.revokeObjectURL(url), 4000);
                            fezAlgo = true;
                        }
                    } catch (e) { console.warn(e); }
                }
                if (c.linhaDigitavel) {
                    try { await navigator.clipboard.writeText(c.linhaDigitavel.replace(/[^\d]/g, '')); fezAlgo = true; } catch (e) {}
                }
                if (!fezAlgo) {
                    mostrarToast('📎 Sem arquivo anexado — toque em ✏️ para anexar');
                    return;
                }
                setContas({
                    ...contas,
                    [empresa]: contasEmpresa.map((x) =>
                        x.id === c.id && x.status === 'pendente'
                            ? { ...x, status: 'boleto_extraido', dataExtracao: new Date().toLocaleDateString('pt-BR') }
                            : x
                    ),
                });
                mostrarToast(c.boletoId && c.linhaDigitavel ? '📥 Baixado + linha digitável copiada' : c.boletoId ? '📥 Arquivo baixado' : '📋 Linha digitável copiada');
            };

            const copiarLinha = async (linha) => {
                try {
                    await navigator.clipboard.writeText(linha.replace(/[^\d]/g, ''));
                    mostrarToast('📋 Linha digitável copiada');
                } catch (e) { mostrarToast('⚠️ Não foi possível copiar'); }
            };

            /* ── Anexo + extração automática ── */
            const anexarBoleto = async (file) => {
                if (!file) return;
                setBoletoFile(file);
                setDadosExtraidos(null);
                if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                    setExtraindo(true);
                    const dados = await extrairDadosBoletoPDF(file);
                    setExtraindo(false);
                    if (dados.erro) {
                        setErroBoleto(MSG_ERRO_BOLETO[dados.erro] || 'Não consegui ler este PDF.');
                        mostrarToast('📎 PDF anexado — preencha os campos manualmente');
                        return;
                    }
                    setErroBoleto('');
                    if (Object.keys(dados).length) {
                        setDadosExtraidos(dados);
                        setForm((f) => ({
                            ...f,
                            valor: f.valor || (dados.valor ? String(dados.valor) : f.valor),
                            vencimento: dados.vencimento || f.vencimento,
                            fornecedor: f.fornecedor || dados.beneficiario || f.fornecedor,
                            linhaDigitavel: dados.linhaDigitavel || f.linhaDigitavel,
                        }));
                        mostrarToast('🤖 Dados do boleto preenchidos automaticamente');
                    } else {
                        mostrarToast('📎 PDF anexado (não identifiquei dados de boleto)');
                    }
                } else {
                    mostrarToast('📎 Arquivo anexado à conta');
                }
            };

            /* ── Importar boletos em lote (PDF → contas com revisão) ── */
            const pareceDuplicada = (dados) => {
                return contasEmpresa.some((c) => {
                    if (dados.linhaDigitavel && c.linhaDigitavel &&
                        dados.linhaDigitavel.replace(/[^\d]/g, '') === c.linhaDigitavel.replace(/[^\d]/g, '')) return true;
                    if (dados.valor && dados.vencimento &&
                        Math.abs(c.valor - dados.valor) < 0.01 && paraISO(c.vencimento) === dados.vencimento) return true;
                    return false;
                });
            };

            const processarBoletos = async (fileList) => {
                const files = Array.from(fileList);
                if (!files.length) return;
                setLendoBoletos(true);
                mostrarToast(`🤖 Lendo ${files.length} ${files.length === 1 ? 'arquivo' : 'arquivos'}…`);
                const itens = [];
                for (const file of files) {
                    let dados = {};
                    if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
                        dados = await extrairDadosBoletoPDF(file);
                    }
                    const motivoErro = dados.erro ? (MSG_ERRO_BOLETO[dados.erro] || '') : '';
                    if (dados.erro) dados = {};
                    const completo = !!(dados.valor && dados.vencimento);
                    itens.push({
                        chave: 'rev-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                        file,
                        incluir: true,
                        duplicada: pareceDuplicada(dados),
                        completo,
                        motivoErro,
                        form: {
                            fornecedor: dados.beneficiario || file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').slice(0, 40),
                            valor: dados.valor ? String(dados.valor) : '',
                            vencimento: dados.vencimento || '',
                            categoria: '',
                            linhaDigitavel: dados.linhaDigitavel || '',
                        },
                    });
                }
                setLendoBoletos(false);
                setRevisao(itens);
            };

            const atualizarRevisao = (chave, campo, valor) => {
                setRevisao((prev) => prev.map((it) => (it.chave === chave ? { ...it, form: { ...it.form, [campo]: valor } } : it)));
            };

            const alternarIncluir = (chave) => {
                setRevisao((prev) => prev.map((it) => (it.chave === chave ? { ...it, incluir: !it.incluir } : it)));
            };

            const confirmarImportacaoBoletos = async () => {
                const selecionados = revisao.filter((it) => it.incluir);
                if (!selecionados.length) {
                    mostrarToast('⚠️ Nenhum boleto selecionado');
                    return;
                }
                const invalidos = selecionados.filter((it) => !it.form.fornecedor.trim() || !parseFloat(String(it.form.valor).replace(',', '.')) || !it.form.vencimento);
                if (invalidos.length) {
                    mostrarToast(`⚠️ ${invalidos.length} ${invalidos.length === 1 ? 'boleto está' : 'boletos estão'} sem fornecedor, valor ou vencimento`);
                    return;
                }
                let proxId = Math.max(0, ...contasEmpresa.map((c) => c.id));
                const novas = [];
                for (const it of selecionados) {
                    const boletoId = 'bol-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
                    try {
                        await salvarArquivoIDB({ id: boletoId, nome: it.file.name, tipo: it.file.type, tamanho: it.file.size, blob: it.file });
                    } catch (e) { console.warn('Falha ao salvar anexo', e); }
                    novas.push({
                        id: ++proxId,
                        fornecedor: it.form.fornecedor.trim(),
                        valor: parseFloat(String(it.form.valor).replace(',', '.')),
                        vencimento: it.form.vencimento,
                        categoria: it.form.categoria,
                        status: 'pendente',
                        linhaDigitavel: it.form.linhaDigitavel || undefined,
                        boletoId,
                        boletoNome: it.file.name,
                        criadaEm: hojeISO(),
                    });
                }
                setContas({ ...contas, [empresa]: [...contasEmpresa, ...novas] });
                setRevisao(null);
                mostrarToast(`🚀 ${novas.length} ${novas.length === 1 ? 'conta criada' : 'contas criadas'} com boleto anexado`);
            };

            /* ── Importar planilha (Excel/CSV → contas) ── */
            const importarPlanilha = async (file) => {
                if (!file || !window.XLSX) return;
                try {
                    const buf = await file.arrayBuffer();
                    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
                    const detectadas = mapearLinhasParaContas(rows);
                    if (!detectadas || !detectadas.length) {
                        mostrarToast('⚠️ Não encontrei colunas de fornecedor e valor na planilha');
                        return;
                    }
                    if (!window.confirm(`Importar ${detectadas.length} contas para ${nomeEmpresa}?`)) return;
                    let proxId = Math.max(0, ...contasEmpresa.map((c) => c.id));
                    const novas = detectadas.map((c) => ({ ...c, id: ++proxId, criadaEm: hojeISO() }));
                    setContas({ ...contas, [empresa]: [...contasEmpresa, ...novas] });
                    mostrarToast(`🚀 ${novas.length} contas importadas`);
                } catch (e) {
                    mostrarToast('⚠️ Não consegui ler a planilha');
                }
            };

            function mapearLinhasParaContas(rows) {
                if (!rows || !rows.length) return null;
                const chaves = Object.keys(rows[0]).map((k) => k.toLowerCase());
                const achar = (opcoes) => {
                    const idx = chaves.findIndex((k) => opcoes.some((o) => k.includes(o)));
                    return idx >= 0 ? Object.keys(rows[0])[idx] : null;
                };
                const kForn = achar(['fornecedor', 'nome', 'benefici', 'descri', 'empresa']);
                const kValor = achar(['valor', 'total', 'r$']);
                const kVenc = achar(['venc', 'data', 'prazo']);
                const kCat = achar(['categoria', 'tipo', 'classe']);
                const kStatus = achar(['status', 'situa', 'pago']);
                if (!kForn || !kValor) return null;
                return rows.map((r) => {
                    let valor = r[kValor];
                    if (typeof valor === 'string') valor = parseFloat(valor.replace(/[R$\s.]/g, '').replace(',', '.'));
                    let venc = kVenc ? r[kVenc] : '';
                    if (venc instanceof Date) venc = isoDate(venc);
                    else venc = paraISO(String(venc));
                    let status = 'pendente';
                    if (kStatus) {
                        const s = String(r[kStatus]).toLowerCase();
                        if (s.includes('pag') || s === 'sim' || s === 'ok') status = 'pago';
                    }
                    return {
                        fornecedor: String(r[kForn]).trim(),
                        valor: parseFloat(valor) || 0,
                        vencimento: venc || hojeISO(),
                        categoria: kCat ? String(r[kCat]).trim() : '',
                        status,
                        ...(status === 'pago' ? { valorPago: parseFloat(valor) || 0 } : {}),
                    };
                }).filter((c) => c.fornecedor && c.valor > 0);
            }

            /* ── Exportações ── */
            const linhasExport = (lista) => lista.map((c) => ({
                Fornecedor: c.fornecedor,
                Categoria: c.categoria || '',
                'Valor Original': c.valor,
                'Valor Pago': c.status === 'pago' ? (c.valorPago != null ? c.valorPago : c.valor) : '',
                'Juros/Multa': c.juros || '',
                Vencimento: fmtData(c.vencimento),
                'Pago em': c.pagaEm ? fmtData(c.pagaEm) : '',
                Status: estaVencida(c) ? 'vencida' : c.status,
                'Linha Digitável': c.linhaDigitavel || '',
            }));

            const exportarLista = (lista, nomeArq) => {
                const ws = XLSX.utils.json_to_sheet(linhasExport(lista));
                ws['!cols'] = [{ wch: 28 }, { wch: 14 }, { wch: 13 }, { wch: 13 }, { wch: 11 }, { wch: 11 }, { wch: 11 }, { wch: 13 }, { wch: 50 }];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Contas');
                XLSX.writeFile(wb, nomeArq + '.xlsx');
                mostrarToast('📊 Excel exportado');
            };

            const exportarExcel = () => {
                const mesStr = mesAtual.toLocaleString('pt-BR', { month: 'short', year: 'numeric' }).replace(/[.\s]/g, '-');
                exportarLista(contasDoMes, `CRM-${nomeEmpresa}-${mesStr}`);
            };

            const exportarCSV = () => {
                const linhas = ['Fornecedor;Categoria;Valor;Valor Pago;Juros;Vencimento;Pago em;Status'];
                contasDoMes.forEach((c) => linhas.push([
                    c.fornecedor, c.categoria || '', String(c.valor).replace('.', ','),
                    c.valorPago != null ? String(c.valorPago).replace('.', ',') : '',
                    c.juros ? String(c.juros).replace('.', ',') : '',
                    fmtData(c.vencimento), c.pagaEm ? fmtData(c.pagaEm) : '', c.status,
                ].join(';')));
                const blob = new Blob(['\uFEFF' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `CRM-${nomeEmpresa}.csv`; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 4000);
                mostrarToast('📋 CSV exportado');
            };

            /* ── Relatórios ── */
            const porCategoria = useMemo(() => {
                const mapa = {};
                contasDoMes.forEach((c) => {
                    const cat = c.categoria || 'Outros';
                    mapa[cat] = (mapa[cat] || 0) + valorEfetivo(c);
                });
                return Object.entries(mapa).sort((a, b) => b[1] - a[1]);
            }, [contasDoMes]);

            const evolucaoMensal = useMemo(() => {
                const meses = [];
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(mesAtual.getFullYear(), mesAtual.getMonth() - i, 1);
                    const doMes = contasEmpresa.filter((c) => mesmoMes(c, d));
                    meses.push({
                        d,
                        label: d.toLocaleString('pt-BR', { month: 'short' }).replace('.', ''),
                        total: doMes.reduce((s, c) => s + valorEfetivo(c), 0),
                        atual: i === 0,
                    });
                }
                return meses;
            }, [contasEmpresa, mesAtual]);

            const historicoMensal = useMemo(() => {
                const mapa = {};
                contasEmpresa.forEach((c) => {
                    const iso = paraISO(c.vencimento);
                    if (!iso) return;
                    const chave = iso.slice(0, 7); // YYYY-MM
                    if (!mapa[chave]) mapa[chave] = { pago: 0, pendente: 0, juros: 0, qtd: 0 };
                    mapa[chave].qtd++;
                    mapa[chave].juros += c.juros || 0;
                    if (c.status === 'pago') mapa[chave].pago += valorEfetivo(c);
                    else mapa[chave].pendente += c.valor;
                });
                return Object.entries(mapa).sort((a, b) => b[0].localeCompare(a[0]));
            }, [contasEmpresa]);

            const contasFornecedor = useMemo(() => {
                if (!fornecedorSel) return [];
                return contasEmpresa
                    .filter((c) => c.fornecedor === fornecedorSel)
                    .sort((a, b) => (paraISO(b.vencimento) || '').localeCompare(paraISO(a.vencimento) || ''));
            }, [contasEmpresa, fornecedorSel]);

            const totFornecedor = contasFornecedor.reduce((s, c) => s + valorEfetivo(c), 0);
            const jurosFornecedor = contasFornecedor.reduce((s, c) => s + (c.juros || 0), 0);

            const contasComJuros = useMemo(() =>
                contasEmpresa.filter((c) => (c.juros || 0) > 0)
                    .sort((a, b) => (b.juros || 0) - (a.juros || 0)),
            [contasEmpresa]);
            const totalJurosGeral = contasComJuros.reduce((s, c) => s + c.juros, 0);

            const topFornecedores = useMemo(() => {
                const mapa = {};
                contasEmpresa.forEach((c) => { mapa[c.fornecedor] = (mapa[c.fornecedor] || 0) + valorEfetivo(c); });
                return Object.entries(mapa).sort((a, b) => b[1] - a[1]).slice(0, 8);
            }, [contasEmpresa]);

            const mesAnterior = new Date(mesAtual.getFullYear(), mesAtual.getMonth() - 1, 1);
            const totalMesAnterior = contasEmpresa.filter((c) => mesmoMes(c, mesAnterior)).reduce((s, c) => s + valorEfetivo(c), 0);
            const variacao = totalMesAnterior > 0 ? ((totalMes - totalMesAnterior) / totalMesAnterior) * 100 : null;

            /* ── Extrato bancário: importação com revisão ── */
            const processarExtrato = async (file) => {
                if (!file) return;
                setLendoExtrato(true);
                let movs = [], saldoOFX = null, saldoDataOFX = null;
                try {
                    const nome = file.name.toLowerCase();
                    if (nome.endsWith('.ofx') || nome.endsWith('.qfx')) {
                        const txt = await file.text();
                        const r = parseOFX(txt);
                        movs = r.movs; saldoOFX = r.saldo; saldoDataOFX = r.saldoData;
                    } else if (/\.(xlsx?|csv|txt)$/.test(nome)) {
                        const buf = await file.arrayBuffer();
                        const wb = XLSX.read(buf, { type: 'array', cellDates: true });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        movs = movimentosDePlanilha(XLSX.utils.sheet_to_json(ws, { defval: '' }));
                        if (!movs.length) {
                            // tenta como texto puro (alguns bancos exportam txt tabulado)
                            const txt = await file.text();
                            movs = movimentosDeTextoPDF(txt);
                        }
                    } else if (nome.endsWith('.pdf')) {
                        const buf = await file.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
                        const paginasItens = [];
                        let textoPlano = '';
                        for (let i = 1; i <= Math.min(pdf.numPages, 60); i++) {
                            const page = await pdf.getPage(i);
                            const tc = await page.getTextContent();
                            paginasItens.push(tc.items.map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width || 0 })));
                            textoPlano += tc.items.map((it) => it.str).join(' ') + '\n';
                        }
                        // 1º: leitura pelas colunas reais do banco (Crédito/Débito/Saldo)
                        const rPos = movimentosDePDFPosicional(paginasItens);
                        if (rPos.movs.length) {
                            movs = rPos.movs;
                            if (rPos.saldo != null) { saldoOFX = rPos.saldo; saldoDataOFX = rPos.saldoData; }
                        } else {
                            // 2º: leitura por texto corrido (outros layouts)
                            movs = movimentosDeTextoPDF(textoPlano);
                        }
                    } else {
                        const txt = await file.text();
                        const r = parseOFX(txt);
                        if (r.movs.length) { movs = r.movs; saldoOFX = r.saldo; saldoDataOFX = r.saldoData; }
                        else movs = movimentosDeTextoPDF(txt);
                    }
                } catch (e) { console.warn('Extrato:', e); }
                setLendoExtrato(false);
                if (!movs.length) {
                    mostrarToast('⚠️ Não identifiquei movimentos — tente exportar o extrato em OFX ou CSV');
                    return;
                }
                // Dedupe por ordinal: dois PIX idênticos no mesmo dia são legítimos
                const contagem = {};
                (caixa.movs || []).forEach((m) => { const k = chaveMov(m); contagem[k] = (contagem[k] || 0) + 1; });
                const vistos = {};
                const itens = movs
                    .sort((a, b) => b.data.localeCompare(a.data))
                    .map((m, i) => {
                        const k = chaveMov(m);
                        vistos[k] = (vistos[k] || 0) + 1;
                        const duplicada = vistos[k] <= (contagem[k] || 0);
                        return {
                            chave: 'mov-' + Date.now() + '-' + i,
                            mov: m,
                            duplicada,
                            incluir: !duplicada,
                        };
                    });
                const soEntradas = movs.length >= 5 && movs.every((m) => m.valor > 0);
                // Distribuição por mês — permite conferir se as datas foram lidas certas
                const porMes = {};
                movs.forEach((m) => { const k = m.data.slice(0, 7); porMes[k] = (porMes[k] || 0) + 1; });
                const distribuicao = Object.entries(porMes).sort((a, b) => a[0].localeCompare(b[0]));
                setRevisaoExtrato({ itens, saldoOFX, saldoDataOFX, arquivo: file.name, soEntradas, distribuicao });
            };

            const difDias = (a, b) => Math.abs((new Date(a + 'T12:00') - new Date(b + 'T12:00')) / 86400000);

            const CATEGORIAS_MOV = ['Comissões', 'Outras receitas', 'Fornecedores', 'Aluguel', 'Pessoal', 'Utilities', 'Folha', 'Seguros', 'Impostos', 'Taxas bancárias', 'Sócios/Retiradas', 'Transferências', 'Outros'];

            const TIPOS_BASE = [
                { id: 'fornecedor', label: 'Fornecedor', emoji: '🏪' },
                { id: 'cliente', label: 'Cliente / Recebimento', emoji: '💵' },
                { id: 'socio', label: 'Sócio / Retirada', emoji: '👔' },
                { id: 'funcionario', label: 'Funcionário', emoji: '👤' },
                { id: 'imposto', label: 'Imposto / Governo', emoji: '🏛️' },
                { id: 'banco', label: 'Banco / Taxa', emoji: '🏦' },
                { id: 'outro', label: 'Outro', emoji: '📌' },
            ];
            const [tiposCustom, setTiposCustom] = useState(() => {
                try { const r = localStorage.getItem('crmfin-tipos'); if (r) return JSON.parse(r); } catch (e) {}
                return [];
            });
            const [novoTipo, setNovoTipo] = useState({ label: '', emoji: '' });
            useEffect(() => { try { localStorage.setItem('crmfin-tipos', JSON.stringify(tiposCustom)); } catch (e) {} }, [tiposCustom]);

            const TIPOS_CONTA = useMemo(() => {
                const base = TIPOS_BASE.filter((t) => t.id !== 'outro');
                return [...base, ...tiposCustom, TIPOS_BASE.find((t) => t.id === 'outro')];
            }, [tiposCustom]);
            const tipoInfo = (t) => TIPOS_CONTA.find((x) => x.id === t) || null;

            const adicionarTipo = () => {
                const label = novoTipo.label.trim();
                if (!label) { mostrarToast('⚠️ Digite o nome do identificador'); return; }
                const id = 'tp-' + label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
                if (TIPOS_CONTA.some((t) => t.id === id || t.label.toLowerCase() === label.toLowerCase())) {
                    mostrarToast('⚠️ Esse identificador já existe'); return;
                }
                setTiposCustom((prev) => [...prev, { id, label, emoji: novoTipo.emoji.trim().slice(0, 4) || '🔖' }]);
                setNovoTipo({ label: '', emoji: '' });
                mostrarToast(`🏪 Identificador "${label}" criado`);
            };

            const removerTipo = (id) => {
                const t = tiposCustom.find((x) => x.id === id);
                const emUso = Object.values(contas).flat().filter((c) => c.tipo === id).length;
                if (!window.confirm(emUso > 0
                    ? `Excluir "${t.label}"? ${emUso} ${emUso === 1 ? 'conta usa' : 'contas usam'} esse identificador e ficarão sem identificação.`
                    : `Excluir "${t.label}"?`)) return;
                setTiposCustom((prev) => prev.filter((x) => x.id !== id));
                mostrarToast('🗑️ Identificador excluído');
            };

            // Normaliza texto para comparar nomes (sem acento, sem ruído bancário)
            const normalizarNome = (s) => String(s || '')
                .toUpperCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/\b(PIX|TED|DOC|ENVIADO|RECEBIDO|TRANSF|TRANSFERENCIA|ELET|DISPON|PAGAMENTO|PAGTO|PAG|BOLETO|DES:|REM:|REMET\.?|LTDA|ME\b|EIRELI|S\/A|SA\b|CIA)\b/g, ' ')
                .replace(/\d{2}\/\d{2}/g, ' ')
                .replace(/[^A-Z0-9 ]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();

            // Verifica se o nome da conta aparece na descrição do movimento
            const PALAVRAS_GENERICAS = /^(ENERGIA|TELECOM|COMERCIO|SERVICOS|SERVICO|ASSESSORIA|CONSULTORIA|DISTRIBUIDORA|DISTRIBUICAO|PARTICIPACOES|EMPRESA|GRUPO|BRASIL|NACIONAL|CENTRO|SISTEMA|SOLUCOES|TECNOLOGIA)$/;
            const nomeBateComMov = (conta, mov) => {
                const alvos = [conta.fornecedor, ...(conta.apelidos ? String(conta.apelidos).split(',') : [])];
                const desc = normalizarNome(mov.descricao);
                if (!desc) return false;
                const palavrasDesc = desc.split(' ');
                return alvos.some((a) => {
                    const n = normalizarNome(a);
                    if (n.length < 4) return false;
                    if (desc.includes(n)) return true;
                    const palavras = n.split(' ').filter((p) => p.length >= 4);
                    if (!palavras.length) return false;
                    // Uma palavra distintiva (≥5 letras, não genérica) já basta
                    const distintiva = palavras.some((p) => p.length >= 5 && !PALAVRAS_GENERICAS.test(p) && palavrasDesc.includes(p));
                    if (distintiva) return true;
                    const achadas = palavras.filter((p) => desc.includes(p)).length;
                    return achadas / palavras.length >= 0.5;
                });
            };
            const listaCategoriasMov = useMemo(() => {
                const base = CATEGORIAS_MOV.filter((c) => c !== 'Outros');
                const custom = categoriasCustom.map((c) => c.nome).filter((n) => !base.includes(n));
                return [...base, ...custom, 'Outros'];
            }, [categoriasCustom]);

            const sugerirCategoriaMov = (m) => {
                const d = m.descricao.toUpperCase();
                if (m.valor < 0 && ehTaxaBancaria(m)) return 'Taxas bancárias';
                if (m.valor > 0 && /(AMIL|UNIMED|BRADESCO|SULAM[ÉE]RICA|SULAMERICA|SUPERMED|NOSSA\s+SAUDE|SEGURADORA|CORRETORA|OPERADORA)/.test(d)) return 'Comissões';
                return '';
            };

            const setCategoriaMov = (id, cat) => {
                setCaixa((cx) => ({ ...cx, movs: (cx.movs || []).map((m) => (m.id === id ? { ...m, categoria: cat } : m)) }));
            };

            // Marca/desmarca manualmente um movimento como taxa bancária
            const alternarTaxaMov = (mov) => {
                const eraTaxa = ehTaxaBancaria(mov);
                setCaixa((cx) => ({
                    ...cx,
                    movs: (cx.movs || []).map((m) => (m.id === mov.id ? { ...m, taxaManual: !eraTaxa } : m)),
                }));
                mostrarToast(eraTaxa ? '↩️ Não é mais taxa — agora entra como despesa comum' : '🏷️ Marcado como taxa bancária');
            };

            // Conciliação manual: liga um movimento a uma conta escolhida
            const conciliarManual = (mov, contaId) => {
                const conta = (contas.salvia || []).find((c) => c.id === Number(contaId));
                if (!conta) return;
                const alvo = arred(Math.abs(mov.valor));
                setCaixa((cx) => ({ ...cx, movs: (cx.movs || []).map((m) => (m.id === mov.id ? { ...m, conciliadoCom: conta.id } : m)) }));
                setContas((prev) => ({
                    ...prev,
                    salvia: (prev.salvia || []).map((c) => {
                        if (c.id !== conta.id) return c;
                        const r = { ...c, movConciliado: mov.id };
                        if (r.status !== 'pago') {
                            r.status = 'pago';
                            r.valorPago = alvo;
                            r.pagaEm = mov.data;
                            const j = arred(alvo - r.valor);
                            r.juros = j > 0.009 ? j : 0;
                            r.pagaPorConciliacao = true;
                        }
                        return r;
                    }),
                }));
                mostrarToast(`🔗 Conciliado com ${conta.fornecedor}`);
            };

            /* ── Conciliação: casa saídas do extrato com contas do CRM ── */
            const executarConciliacao = (movLista, contaLista) => {
                const contasL = contaLista.map((c) => ({ ...c }));
                const movsL = movLista.map((m) => ({ ...m }));
                let marcadas = 0, vinculos = 0;

                // Índices por valor (em centavos) — evita varrer todas as contas para cada movimento
                const idxPagas = new Map();
                const idxAbertas = [];
                contasL.forEach((c) => {
                    if (c.movConciliado) return;
                    if (c.status === 'pago') {
                        const cent = Math.round(arred(c.valorPago != null ? c.valorPago : c.valor) * 100);
                        if (!idxPagas.has(cent)) idxPagas.set(cent, []);
                        idxPagas.get(cent).push(c);
                    } else {
                        idxAbertas.push(c);
                    }
                });
                // Abertas ordenadas por valor: permite busca binária por faixa
                idxAbertas.sort((a, b) => a.valor - b.valor);
                const buscaInicio = (min) => {
                    let lo = 0, hi = idxAbertas.length;
                    while (lo < hi) { const mid = (lo + hi) >> 1; if (idxAbertas[mid].valor < min) lo = mid + 1; else hi = mid; }
                    return lo;
                };

                movsL.forEach((m) => {
                    if (m.valor >= 0 || m.conciliadoCom) return;
                    const alvo = arred(Math.abs(m.valor));
                    const cent = Math.round(alvo * 100);
                    let c = null;

                    // 1º: conta já paga com o mesmo valor, até 3 dias de diferença
                    const candPagas = idxPagas.get(cent);
                    if (candPagas && candPagas.length) {
                        const validas = candPagas.filter((x) => {
                            if (x.movConciliado) return false;
                            const dp = paraISO(x.pagaEm || x.vencimento);
                            return dp && difDias(dp, m.data) <= 3;
                        });
                        c = validas.find((x) => nomeBateComMov(x, m)) || validas[0] || null;
                    }

                    // 2º: conta em aberto — o extrato prova o pagamento e dá baixa sozinho
                    if (!c) {
                        // Só contas cujo valor esteja entre alvo/1.2 e alvo (pagamento >= valor original)
                        let i = buscaInicio(alvo / 1.2 - 0.01);
                        let melhor = null, melhorScore = Infinity;
                        for (; i < idxAbertas.length; i++) {
                            const x = idxAbertas[i];
                            if (x.valor > alvo + 0.01) break; // ordenado: daqui pra frente todos maiores
                            if (x.movConciliado || x.status === 'pago') continue;
                            if (alvo > x.valor * 1.2 + 0.01) continue;
                            const v = paraISO(x.vencimento);
                            if (!v) continue;
                            const d = (new Date(m.data + 'T12:00') - new Date(v + 'T12:00')) / 86400000;
                            if (d < -5 || d > 60) continue;
                            const score = (nomeBateComMov(x, m) ? 0 : 1000) + Math.abs(x.valor - alvo);
                            if (score < melhorScore) { melhorScore = score; melhor = x; }
                        }
                        c = melhor;
                        if (c) {
                            c.status = 'pago';
                            c.valorPago = alvo;
                            c.pagaEm = m.data;
                            const j = arred(alvo - c.valor);
                            c.juros = j > 0.009 ? j : 0;
                            c.pagaPorConciliacao = true;
                            marcadas++;
                        }
                    }
                    if (c) {
                        m.conciliadoCom = c.id;
                        c.movConciliado = m.id;
                        vinculos++;
                    }
                });
                return { movsL, contasL, marcadas, vinculos };
            };

            const conciliarAgora = () => {
                const r = executarConciliacao(caixa.movs || [], contas.salvia || []);
                setCaixa((cx) => ({ ...cx, movs: r.movsL }));
                setContas((prev) => ({ ...prev, salvia: r.contasL }));
                mostrarToast(r.vinculos === 0
                    ? '🔗 Nada novo para conciliar'
                    : `🔗 ${r.vinculos} conciliações` + (r.marcadas > 0 ? ` · ${r.marcadas} contas baixadas pelo extrato` : ''));
            };

            const desconciliar = (mov) => {
                const conta = (contas.salvia || []).find((c) => c.id === mov.conciliadoCom);
                const eraAuto = conta && conta.pagaPorConciliacao;
                setCaixa((cx) => ({
                    ...cx,
                    movs: (cx.movs || []).map((m) => {
                        if (m.id !== mov.id) return m;
                        const r = { ...m };
                        delete r.conciliadoCom;
                        return r;
                    }),
                }));
                setContas((prev) => ({
                    ...prev,
                    salvia: (prev.salvia || []).map((c) => {
                        if (c.id !== mov.conciliadoCom) return c;
                        const r = { ...c };
                        delete r.movConciliado;
                        if (r.pagaPorConciliacao) {
                            r.status = 'pendente';
                            delete r.valorPago;
                            delete r.juros;
                            delete r.pagaEm;
                            delete r.diasAtraso;
                            delete r.pagaPorConciliacao;
                        }
                        return r;
                    }),
                }));
                mostrarToast(eraAuto ? '↩️ Conciliação desfeita — conta voltou a pendente' : '↩️ Conciliação desfeita');
            };

            const confirmarExtrato = () => {
                const selecionados = revisaoExtrato.itens.filter((it) => it.incluir);
                const novos = selecionados.map((it, i) => ({
                    id: 'mv-' + Date.now() + '-' + i,
                    ...it.mov,
                    categoria: it.mov.categoria || aplicarRegras(it.mov) || sugerirCategoriaMov(it.mov) || undefined,
                    origem: revisaoExtrato.arquivo,
                }));
                const todosMovs = [...(caixa.movs || []), ...novos].sort((a, b) => b.data.localeCompare(a.data));
                // Concilia automaticamente e atualiza contas pendentes que o extrato prova pagas
                let r = executarConciliacao(todosMovs, contas.salvia || []);
                let taxasCriadas = 0;
                if (caixa.gerarContasTaxas) {
                    const rt = gerarContasDasTaxas(r.movsL, r.contasL);
                    r = { ...r, movsL: rt.movsL, contasL: rt.contasL };
                    taxasCriadas = rt.criadas;
                }
                setCaixa((cx) => ({
                    ...cx,
                    movs: r.movsL,
                    ...(revisaoExtrato.saldoOFX != null ? { saldoAtual: revisaoExtrato.saldoOFX, saldoData: revisaoExtrato.saldoDataOFX || hojeISO() } : {}),
                }));
                setContas((prev) => ({ ...prev, salvia: r.contasL }));
                setRevisaoExtrato(null);
                mostrarToast(
                    `🏦 ${novos.length} movimentos importados`
                    + (r.vinculos > 0 ? ` · ${r.vinculos} conciliados` : '')
                    + (r.marcadas > 0 ? ` · ${r.marcadas} contas baixadas` : '')
                    + (taxasCriadas > 0 ? ` · ${taxasCriadas} taxas viraram contas` : '')
                    + (revisaoExtrato.saldoOFX != null ? ' · saldo atualizado' : '')
                );
            };

            const excluirMovimento = (id) => {
                // Limpa o vínculo na conta conciliada, se houver
                const mov = (caixa.movs || []).find((m) => m.id === id);
                if (mov && mov.conciliadoCom) {
                    setContas((prev) => ({
                        ...prev,
                        salvia: (prev.salvia || []).map((c) => {
                            if (c.id !== mov.conciliadoCom) return c;
                            const r = { ...c };
                            delete r.movConciliado;
                            return r;
                        }),
                    }));
                }
                setCaixa((cx) => ({ ...cx, movs: (cx.movs || []).filter((m) => m.id !== id) }));
            };

            /* ── Gerenciar extrato: excluir por arquivo ou tudo ── */
            const origensExtrato = useMemo(() => {
                const mapa = {};
                (caixa.movs || []).forEach((m) => {
                    const o = m.origem || 'sem arquivo';
                    if (!mapa[o]) mapa[o] = { qtd: 0, min: m.data, max: m.data };
                    mapa[o].qtd++;
                    if (m.data < mapa[o].min) mapa[o].min = m.data;
                    if (m.data > mapa[o].max) mapa[o].max = m.data;
                });
                return Object.entries(mapa);
            }, [caixa.movs]);

            const limparVinculosDosMovs = (idsMovs) => {
                const setIds = new Set(idsMovs);
                setContas((prev) => ({
                    ...prev,
                    salvia: (prev.salvia || []).map((c) => {
                        if (!c.movConciliado || !setIds.has(c.movConciliado)) return c;
                        const r = { ...c };
                        delete r.movConciliado;
                        return r;
                    }),
                }));
            };

            const excluirExtratoPorArquivo = (origem) => {
                const alvos = (caixa.movs || []).filter((m) => (m.origem || 'sem arquivo') === origem);
                if (!window.confirm(`Excluir os ${alvos.length} movimentos importados de "${origem}"? As contas conciliadas continuam, só o vínculo é removido.`)) return;
                limparVinculosDosMovs(alvos.map((m) => m.id));
                setCaixa((cx) => ({ ...cx, movs: (cx.movs || []).filter((m) => (m.origem || 'sem arquivo') !== origem) }));
                mostrarToast(`🗑️ ${alvos.length} movimentos de "${origem}" excluídos`);
            };

            const excluirExtratoTudo = () => {
                const total = (caixa.movs || []).length;
                if (!total) { mostrarToast('Não há movimentos para excluir'); return; }
                if (!window.confirm(`Apagar TODOS os ${total} movimentos do extrato? O saldo e as contas ficam — só o extrato é limpo. Essa ação não pode ser desfeita (faça um backup antes, se quiser).`)) return;
                limparVinculosDosMovs((caixa.movs || []).map((m) => m.id));
                setCaixa((cx) => ({ ...cx, movs: [] }));
                mostrarToast('🗑️ Extrato limpo — importe novamente quando quiser');
            };

            /* ── Taxas bancárias → contas separadas no CRM ── */
            const gerarContasDasTaxas = (movLista, contaLista, silencioso) => {
                const contasL = contaLista.map((c) => ({ ...c }));
                const movsL = movLista.map((m) => ({ ...m }));
                let proxId = Math.max(0, ...contasL.map((c) => c.id));
                let criadas = 0;
                movsL.forEach((m) => {
                    if (m.valor >= 0 || m.conciliadoCom || !ehTaxaBancaria(m)) return;
                    const nova = {
                        id: ++proxId,
                        fornecedor: m.descricao.slice(0, 42),
                        valor: arred(Math.abs(m.valor)),
                        vencimento: m.data,
                        categoria: 'Taxas bancárias',
                        status: 'pago',
                        valorPago: arred(Math.abs(m.valor)),
                        juros: 0,
                        pagaEm: m.data,
                        movConciliado: m.id,
                        geradaDeTaxa: true,
                        criadaEm: hojeISO(),
                    };
                    contasL.push(nova);
                    m.conciliadoCom = nova.id;
                    criadas++;
                });
                return { movsL, contasL, criadas };
            };

            const gerarContasTaxasAgora = () => {
                const r = gerarContasDasTaxas(caixa.movs || [], contas.salvia || []);
                if (!r.criadas) { mostrarToast('🏷️ Nenhuma taxa nova para virar conta'); return; }
                setCaixa((cx) => ({ ...cx, movs: r.movsL }));
                setContas((prev) => ({ ...prev, salvia: r.contasL }));
                mostrarToast(`🏷️ ${r.criadas} ${r.criadas === 1 ? 'conta de taxa criada' : 'contas de taxas criadas'} (categoria Taxas bancárias)`);
            };

            /* ── Resolver divergências: criar conta a partir de um movimento do extrato ── */
            const criarContasDeMovimentos = (listaMovs) => {
                const contasL = (contas.salvia || []).map((c) => ({ ...c }));
                const movsL = (caixa.movs || []).map((m) => ({ ...m }));
                let proxId = Math.max(0, ...contasL.map((c) => c.id));
                let criadas = 0;
                const ids = new Set(listaMovs.map((m) => m.id));
                movsL.forEach((m) => {
                    if (!ids.has(m.id) || m.valor >= 0 || m.conciliadoCom) return;
                    const nova = {
                        id: ++proxId,
                        fornecedor: m.descricao.slice(0, 42),
                        valor: arred(Math.abs(m.valor)),
                        vencimento: m.data,
                        categoria: ehTaxaBancaria(m) ? 'Taxas bancárias' : (m.categoria && CATEGORIAS[m.categoria] ? m.categoria : ''),
                        status: 'pago',
                        valorPago: arred(Math.abs(m.valor)),
                        juros: 0,
                        pagaEm: m.data,
                        movConciliado: m.id,
                        criadaDoExtrato: true,
                        criadaEm: hojeISO(),
                    };
                    contasL.push(nova);
                    m.conciliadoCom = nova.id;
                    criadas++;
                });
                if (!criadas) { mostrarToast('Nada para criar'); return; }
                setCaixa((cx) => ({ ...cx, movs: movsL }));
                setContas((prev) => ({ ...prev, salvia: contasL }));
                mostrarToast(`➕ ${criadas} ${criadas === 1 ? 'conta criada e conciliada' : 'contas criadas e conciliadas'} — edite categoria/fornecedor na aba Contas se quiser`);
            };

            const salvarSaldo = () => {
                const v = parseValorExtrato(saldoTxt);
                if (isNaN(v)) { mostrarToast('⚠️ Valor inválido'); return; }
                setCaixa((cx) => ({ ...cx, saldoAtual: v, saldoData: hojeISO() }));
                setSaldoEditando(false);
                setSaldoTxt('');
                mostrarToast('💰 Saldo atualizado');
            };

            /* ── Caixa: dados derivados (visão mês ou ano) ── */
            const movsDoMes = useMemo(() => {
                let lista = (caixa.movs || []).filter((m) => {
                    const [a, mm] = m.data.split('-').map(Number);
                    if (a !== mesAtual.getFullYear()) return false;
                    return periodoCaixa === 'ano' ? true : mm === mesAtual.getMonth() + 1;
                });
                const q = buscaMov.trim().toLowerCase();
                if (q) lista = lista.filter((m) => (m.descricao + ' ' + (m.dcto || '')).toLowerCase().includes(q));
                if (filtroCatMov === 'sem') lista = lista.filter((m) => !m.categoria);
                else if (filtroCatMov !== 'todas') lista = lista.filter((m) => m.categoria === filtroCatMov);
                return lista;
            }, [caixa.movs, mesAtual, buscaMov, periodoCaixa, filtroCatMov]);

            const rotuloPeriodo = periodoCaixa === 'ano' ? String(mesAtual.getFullYear()) : null;

            // Saldo do extrato: último lançamento que trouxe saldo (o banco é a fonte da verdade)
            const saldoDoExtrato = useMemo(() => {
                const comSaldo = (caixa.movs || []).filter((m) => m.saldo != null);
                if (!comSaldo.length) return null;
                const maxData = comSaldo.reduce((mx, m) => (m.data > mx ? m.data : mx), '');
                const doDia = comSaldo.filter((m) => m.data === maxData);
                const ult = doDia[doDia.length - 1];
                return { valor: arred(ult.saldo), data: ult.data };
            }, [caixa.movs]);

            const saldoDivergente = saldoDoExtrato && caixa.saldoAtual != null
                && Math.abs(arred(caixa.saldoAtual) - saldoDoExtrato.valor) > 0.01;

            const usarSaldoDoExtrato = () => {
                if (!saldoDoExtrato) return;
                setCaixa((cx) => ({ ...cx, saldoAtual: saldoDoExtrato.valor, saldoData: saldoDoExtrato.data }));
                mostrarToast('🏦 Saldo ajustado pelo extrato');
            };

            const entradasMes = movsDoMes.filter((m) => m.valor > 0).reduce((s, m) => s + m.valor, 0);
            const saidasMes = movsDoMes.filter((m) => m.valor < 0).reduce((s, m) => s + Math.abs(m.valor), 0);
            const taxasMes = movsDoMes.filter((m) => m.valor < 0 && ehTaxaBancaria(m)).reduce((s, m) => s + Math.abs(m.valor), 0);

            const nomeContaConciliada = (mov) => {
                const c = (contas.salvia || []).find((c) => c.id === mov.conciliadoCom);
                return c ? c.fornecedor : 'conta';
            };

            /* ── Fechamento do mês: extrato × CRM ── */
            const fechamento = useMemo(() => {
                if (empresa !== 'salvia') return null;
                const noMes = (iso) => {
                    if (!iso) return false;
                    const [a, m] = iso.split('-').map(Number);
                    return a === mesAtual.getFullYear() && m === mesAtual.getMonth() + 1;
                };
                const pagasMes = (contas.salvia || []).filter((c) => c.status === 'pago' && noMes(paraISO(c.pagaEm || c.vencimento)));
                const totalPagasCRM = pagasMes.reduce((s, c) => s + valorEfetivo(c), 0);
                const movsMes = (caixa.movs || []).filter((m) => noMes(m.data));
                const saidasExtrato = movsMes.filter((m) => m.valor < 0).reduce((s, m) => s + Math.abs(m.valor), 0);
                const pagasSemExtrato = pagasMes.filter((c) => !c.movConciliado);
                const saidasSemConta = movsMes.filter((m) => m.valor < 0 && !m.conciliadoCom && !ehTaxaBancaria(m));
                const taxas = movsMes.filter((m) => m.valor < 0 && ehTaxaBancaria(m)).reduce((s, m) => s + Math.abs(m.valor), 0);
                const diferenca = saidasExtrato - totalPagasCRM;
                return {
                    totalPagasCRM,
                    saidasExtrato,
                    diferenca,
                    fechado: Math.abs(diferenca) <= 0.01,
                    pagasSemExtrato,
                    valorPagasSemExtrato: pagasSemExtrato.reduce((s, c) => s + valorEfetivo(c), 0),
                    saidasSemConta,
                    valorSaidasSemConta: saidasSemConta.reduce((s, m) => s + Math.abs(m.valor), 0),
                    taxas,
                    temExtrato: movsMes.length > 0,
                };
            }, [empresa, contas, caixa.movs, mesAtual]);

            /* ── Projeção de caixa 90 dias ── */
            const projecao = useMemo(() => {
                if (empresa !== 'salvia' || caixa.saldoAtual == null) return null;
                const hoje = new Date(hojeISO() + 'T12:00');
                const movs = caixa.movs || [];
                const corte = new Date(hoje); corte.setDate(corte.getDate() - 90);
                const entradas90 = movs.filter((m) => m.valor > 0 && new Date(m.data + 'T12:00') >= corte).reduce((s, m) => s + m.valor, 0);
                const mediaDiariaEntrada = entradas90 / 90;
                const pendentes = (contas.salvia || []).filter((c) => c.status !== 'pago');
                const saidaPorDia = {};
                pendentes.forEach((c) => {
                    const v = paraISO(c.vencimento);
                    if (!v) return;
                    const diff = Math.round((new Date(v + 'T12:00') - hoje) / 86400000);
                    const dia = diff < 0 ? 0 : Math.min(90, diff); // vencidas pesam hoje
                    saidaPorDia[dia] = (saidaPorDia[dia] || 0) + c.valor;
                });
                const pontos = [];
                let cons = caixa.saldoAtual, real = caixa.saldoAtual;
                for (let dia = 0; dia <= 90; dia++) {
                    cons -= (saidaPorDia[dia] || 0);
                    real = real - (saidaPorDia[dia] || 0) + (dia > 0 ? mediaDiariaEntrada : 0);
                    pontos.push({ dia, cons, real });
                }
                const serie = projecaoModo === 'conservadora' ? pontos.map((p) => p.cons) : pontos.map((p) => p.real);
                const diaNegativo = serie.findIndex((v) => v < 0);
                const minimo = Math.min(...serie);
                const diaMinimo = serie.indexOf(minimo);
                return { pontos, serie, diaNegativo, minimo, diaMinimo, mediaMensalEntrada: mediaDiariaEntrada * 30, totalSaidas90: Object.values(saidaPorDia).reduce((s, v) => s + v, 0) };
            }, [empresa, caixa, contas, projecaoModo]);

            const dataDoDia = (dia) => {
                const d = new Date(hojeISO() + 'T12:00');
                d.setDate(d.getDate() + dia);
                return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
            };

            /* ── Central de pendências ── */
            const [filtroPend, setFiltroPend] = useState('saidas');
            const [pendTodoAno, setPendTodoAno] = useState(true);

            const noPeriodoPend = (iso) => {
                if (!iso) return false;
                const [a, m] = iso.split('-').map(Number);
                if (a !== mesAtual.getFullYear()) return false;
                return pendTodoAno ? true : m === mesAtual.getMonth() + 1;
            };

            const pendencias = useMemo(() => {
                if (empresa !== 'salvia') return null;
                const movs = (caixa.movs || []).filter((m) => noPeriodoPend(m.data));
                const cs = contas.salvia || [];
                return {
                    saidas: movs.filter((m) => m.valor < 0 && !m.conciliadoCom && !ehTaxaBancaria(m)),
                    recebidos: movs.filter((m) => m.valor > 0 && !m.categoria),
                    taxas: movs.filter((m) => m.valor < 0 && !m.conciliadoCom && ehTaxaBancaria(m)),
                    semCategoria: movs.filter((m) => m.valor < 0 && !m.categoria),
                    contasSemExtrato: cs.filter((c) => c.status === 'pago' && !c.movConciliado && noPeriodoPend(paraISO(c.pagaEm || c.vencimento))),
                    contasSemTipo: cs.filter((c) => !c.tipo),
                };
            }, [empresa, caixa.movs, contas, mesAtual, pendTodoAno]);

            const totalPendencias = pendencias
                ? pendencias.saidas.length + pendencias.recebidos.length + pendencias.taxas.length + pendencias.contasSemExtrato.length + pendencias.contasSemTipo.length
                : 0;

            const contasParaConciliar = useMemo(() =>
                (contas.salvia || []).filter((c) => !c.movConciliado).sort((a, b) => (paraISO(b.vencimento) || '').localeCompare(paraISO(a.vencimento) || '')),
            [contas]);

            const [tickAtualizar, setTickAtualizar] = useState(0);
            const atualizarTudo = () => {
                if (empresa === 'salvia') {
                    const r = executarConciliacao(caixa.movs || [], contas.salvia || []);
                    if (r.vinculos > 0) {
                        setCaixa((cx) => ({ ...cx, movs: r.movsL }));
                        setContas((prev) => ({ ...prev, salvia: r.contasL }));
                    }
                    setTickAtualizar((t) => t + 1);
                    mostrarToast(r.vinculos > 0 ? `🔄 Atualizado · ${r.vinculos} novas conciliações` : '🔄 Valores atualizados');
                } else {
                    setTickAtualizar((t) => t + 1);
                    mostrarToast('🔄 Valores atualizados');
                }
            };

            /* ── Saudação ── */
            const hora = new Date().getHours();
            const saudacao = hora < 12 ? 'Bom dia' : hora < 18 ? 'Boa tarde' : 'Boa noite';
            const dataHoje = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
            const mesNome = mesAtual.toLocaleString('pt-BR', { month: 'long' });

            const CORES_BARRAS = ['#5CC87A', '#0A84FF', '#FF9500', '#AF52DE', '#FF3B30', '#40C8B0', '#FFB800', '#8E8E93'];
            const CORES_SILXAN = ['#F26BAE', '#0A84FF', '#FF9500', '#AF52DE', '#FF3B30', '#40C8B0', '#FFB800', '#8E8E93'];
            const coresBarras = ehSilxan ? CORES_SILXAN : CORES_BARRAS;
            const maxCat = porCategoria.length ? porCategoria[0][1] : 1;
            const maxMes = Math.max(...evolucaoMensal.map((m) => m.total), 1);

            const ABAS = [
                { id: 'dashboard', label: 'Início', ico: '🏠' },
                { id: 'contas', label: 'Contas', ico: '📋' },
                ...(empresa === 'salvia' ? [{ id: 'caixa', label: 'Caixa', ico: '💰' }, { id: 'pendencias', label: 'Pendências', ico: '🔗' }] : []),
                { id: 'relatorios', label: 'Relatórios', ico: '📈' },
            ];

            const RELATORIOS = [
                { id: 'mensal', label: 'Histórico mensal', ico: '🗓️' },
                ...(empresa === 'salvia' ? [{ id: 'fluxo', label: 'Fluxo de caixa', ico: '💰' }, { id: 'receber', label: 'Comissões a receber', ico: '💵' }] : []),
                { id: 'situacao', label: 'Pagas / Vencidas', ico: '✅' },
                { id: 'identificacao', label: 'Por identificação', ico: '🏪' },
                { id: 'fornecedor', label: 'Por fornecedor', ico: '🏢' },
                { id: 'evolucao', label: 'Evolução', ico: '📊' },
                { id: 'categoria', label: 'Categorias', ico: '🗂️' },
                { id: 'juros', label: 'Juros pagos', ico: '💸' },
                { id: 'top', label: 'Top fornecedores', ico: '🏆' },
            ];

            /* ── Conferência de recebíveis: esperado × recebido, mês a mês ── */
            const nomeBateRecebivel = (rec, mov) => {
                const alvos = [rec.operadora, ...(rec.apelidos ? String(rec.apelidos).split(',') : [])];
                const desc = normalizarNome(mov.descricao);
                if (!desc) return false;
                const pd = desc.split(' ');
                return alvos.some((a) => {
                    const n = normalizarNome(a);
                    if (n.length < 3) return false;
                    if (desc.includes(n)) return true;
                    const pal = n.split(' ').filter((p) => p.length >= 4);
                    return pal.some((p) => pd.includes(p));
                });
            };

            const conferenciaRecebiveis = useMemo(() => {
                if (empresa !== 'salvia' || !receber.length) return null;
                const ano = mesAtual.getFullYear();
                const mesRef = periodoCaixa === 'ano' ? null : mesAtual.getMonth() + 1;
                const meses = mesRef ? [mesRef] : Array.from({ length: 12 }, (_, i) => i + 1)
                    .filter((m) => (caixa.movs || []).some((mv) => mv.data.startsWith(`${ano}-${String(m).padStart(2, '0')}`)));
                const linhas = [];
                meses.forEach((mm) => {
                    const prefixo = `${ano}-${String(mm).padStart(2, '0')}`;
                    const creditos = (caixa.movs || []).filter((m) => m.valor > 0 && m.data.startsWith(prefixo));
                    receber.forEach((rec) => {
                        const casados = creditos.filter((m) => nomeBateRecebivel(rec, m));
                        const recebido = arred(casados.reduce((s, m) => s + m.valor, 0));
                        linhas.push({
                            chave: rec.id + '-' + prefixo,
                            mes: prefixo,
                            operadora: rec.operadora,
                            esperado: rec.valorEsperado,
                            recebido,
                            diferenca: arred(recebido - rec.valorEsperado),
                            qtd: casados.length,
                        });
                    });
                });
                const totalEsperado = arred(linhas.reduce((s, l) => s + l.esperado, 0));
                const totalRecebido = arred(linhas.reduce((s, l) => s + l.recebido, 0));
                return {
                    linhas,
                    totalEsperado,
                    totalRecebido,
                    diferenca: arred(totalRecebido - totalEsperado),
                    naoRecebidos: linhas.filter((l) => l.recebido === 0),
                    aMenor: linhas.filter((l) => l.recebido > 0 && l.diferenca < -0.01),
                };
            }, [empresa, receber, caixa.movs, mesAtual, periodoCaixa]);

            /* ── Relatório por identificação (tipo) ── */
            const porIdentificacao = useMemo(() => {
                const mapa = {};
                contasDoMes.forEach((c) => {
                    const t = c.tipo || 'sem';
                    if (!mapa[t]) mapa[t] = { total: 0, qtd: 0 };
