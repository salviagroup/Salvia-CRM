                                        ))}
                                        {tiposCustom.map((t) => (
                                            <span key={t.id} className="badge" style={{ background: 'rgba(10,132,255,0.1)', color: '#0A6FDB', display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '11.5px', padding: '7px 12px' }}>
                                                {t.emoji} {t.label}
                                                <span style={{ cursor: 'pointer', fontWeight: 900 }} title="Excluir" onClick={() => removerTipo(t.id)}>✕</span>
                                            </span>
                                        ))}
                                    </div>
                                </div>

                                {/* Comissões a receber */}
                                <div className="config-secao">
                                    <h4>💵 Comissões a receber (Sálvia)</h4>
                                    <div className="desc">Cadastre quanto espera receber de cada operadora por mês. O CRM confere contra os créditos do extrato e avisa o que <b>não caiu</b> — relatório em 📈 Comissões a receber.</div>
                                    <div style={{ display: 'flex', gap: '8px', marginBottom: '10px', flexWrap: 'wrap' }}>
                                        <input placeholder="Operadora (ex: Amil)" value={novoRec.operadora} onChange={(e) => setNovoRec({ ...novoRec, operadora: e.target.value })} style={{ flex: 2, minWidth: '130px', marginBottom: 0 }} />
                                        <input placeholder="Valor esperado" inputMode="decimal" value={novoRec.valor} onChange={(e) => setNovoRec({ ...novoRec, valor: e.target.value })} style={{ flex: 1, minWidth: '110px', marginBottom: 0 }} />
                                        <input placeholder="Dia" inputMode="numeric" value={novoRec.dia} onChange={(e) => setNovoRec({ ...novoRec, dia: e.target.value })} style={{ width: '64px', marginBottom: 0, textAlign: 'center' }} />
                                        <button className="btn-sm primary" style={{ whiteSpace: 'nowrap' }} onClick={adicionarRecebivel}>＋ Add</button>
                                    </div>
                                    {receber.length === 0 ? (
                                        <div style={{ fontSize: '12px', color: 'var(--texto-sec)', fontWeight: 600 }}>Nenhuma operadora cadastrada. Ex: Amil, Bradesco Saúde, SulAmérica, Unimed…</div>
                                    ) : (
                                        receber.map((r) => (
                                            <div key={r.id} className="file-item" style={{ marginBottom: '8px', flexWrap: 'wrap' }}>
                                                <div className="file-icon">💵</div>
                                                <div style={{ flex: 1, minWidth: '120px' }}>
                                                    <div className="file-name">{r.operadora}</div>
                                                    <div className="file-size">R$ {fmtValor(r.valorEsperado)}/mês · todo dia {r.dia}</div>
                                                </div>
                                                <input placeholder="Como aparece no extrato (apelidos)" value={r.apelidos || ''} onChange={(e) => atualizarRecebivel(r.id, 'apelidos', e.target.value)}
                                                    style={{ flex: 1, minWidth: '150px', marginBottom: 0, fontSize: '11.5px', border: 'none', background: '#fff', borderRadius: '9px', padding: '8px 10px', outline: 'none' }} />
                                                <button className="icon-btn excluir" title="Remover" onClick={() => removerRecebivel(r.id)}>✕</button>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Regras de categorização */}
                                <div className="config-secao">
                                    <h4>⚡ Regras de categorização</h4>
                                    <div className="desc">"Toda descrição que contém X vira categoria Y" — aplicado automaticamente ao importar extratos. Acaba com a categorização manual repetitiva.</div>
                                    <div style={{ display: 'flex', gap: '8px', marginBottom: '10px', flexWrap: 'wrap' }}>
                                        <input placeholder="Se a descrição contém… (ex: CELESC)" value={novaRegra.texto} onChange={(e) => setNovaRegra({ ...novaRegra, texto: e.target.value })} style={{ flex: 2, minWidth: '150px', marginBottom: 0 }} />
                                        <select value={novaRegra.categoria} onChange={(e) => setNovaRegra({ ...novaRegra, categoria: e.target.value })}
                                            style={{ flex: 1, minWidth: '130px', marginBottom: 0, border: 'none', background: 'var(--ios-gray6)', borderRadius: '12px', padding: '11px 13px', fontSize: '13px', outline: 'none' }}>
                                            <option value="">Categoria…</option>
                                            {listaCategoriasMov.map((c) => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                        <button className="btn-sm primary" style={{ whiteSpace: 'nowrap' }} onClick={adicionarRegra}>＋ Criar</button>
                                    </div>
                                    {regras.length === 0 ? (
                                        <div style={{ fontSize: '12px', color: 'var(--texto-sec)', fontWeight: 600, marginBottom: '8px' }}>Nenhuma regra ainda. Ex: "AMIL" → Comissões · "CELESC" → Utilities · "TARIFA" → Taxas bancárias</div>
                                    ) : (
                                        <div style={{ display: 'flex', gap: '7px', flexWrap: 'wrap', marginBottom: '10px' }}>
                                            {regras.map((r, i) => (
                                                <span key={i} className="badge" style={{ background: 'rgba(255,149,0,0.12)', color: '#B45309', display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '11.5px', padding: '7px 12px' }}>
                                                    "{r.texto}" → {r.categoria}
                                                    <span style={{ cursor: 'pointer', fontWeight: 900 }} title="Excluir regra" onClick={() => setRegras((prev) => prev.filter((_, j) => j !== i))}>✕</span>
                                                </span>
                                            ))}
                                        </div>
                                    )}
                                    {regras.length > 0 && <button className="btn-sm primary" onClick={aplicarRegrasAgora}>⚡ Aplicar nos movimentos existentes</button>}
                                </div>

                                {/* Fechamento de meses */}
                                <div className="config-secao">
                                    <h4>🔒 Fechamento de meses</h4>
                                    <div className="desc">Depois de conciliar um mês, feche-o: contas dele ficam protegidas contra edição, exclusão e alteração de pagamento. Reabra a qualquer momento.</div>
                                    {historicoMensal.length === 0 ? (
                                        <div style={{ fontSize: '12px', color: 'var(--texto-sec)', fontWeight: 600 }}>Nenhum mês com movimento ainda.</div>
                                    ) : (
                                        <div style={{ display: 'flex', gap: '7px', flexWrap: 'wrap' }}>
                                            {historicoMensal.map(([chave]) => {
                                                const [a, mm] = chave.split('-').map(Number);
                                                const fechado = mesesFechados.includes(chave);
                                                return (
                                                    <button key={chave} className="badge" onClick={() => alternarMesFechado(chave)}
                                                        style={{ cursor: 'pointer', border: 'none', fontSize: '12px', padding: '8px 13px', background: fechado ? 'rgba(52,199,89,0.15)' : 'var(--ios-gray6)', color: fechado ? '#1E9A46' : 'var(--texto-sec)' }}>
                                                        {fechado ? '🔒' : '🔓'} {new Date(a, mm - 1, 1).toLocaleString('pt-BR', { month: 'short' }).replace('.', '')}/{String(a).slice(2)}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>

                                {/* Categorias personalizadas */}
                                <div className="config-secao">
                                    <h4>🗂️ Minhas categorias</h4>
                                    <div className="desc">Crie categorias próprias — elas aparecem no cadastro de contas, na revisão de boletos, no extrato e nos filtros, junto com as padrões.</div>
                                    <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
                                        <input placeholder="Nome da categoria (ex: Marketing)" value={novaCatNome} onChange={(e) => setNovaCatNome(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && adicionarCategoria()} style={{ flex: 1, marginBottom: 0 }} />
                                        <input placeholder="Emoji" value={novaCatEmoji} onChange={(e) => setNovaCatEmoji(e.target.value)} style={{ width: '76px', marginBottom: 0, textAlign: 'center' }} maxLength={4} />
                                        <button className="btn-sm primary" style={{ whiteSpace: 'nowrap' }} onClick={adicionarCategoria}>＋ Criar</button>
                                    </div>
                                    {categoriasCustom.length === 0 ? (
                                        <div style={{ fontSize: '12px', color: 'var(--texto-sec)', fontWeight: 600 }}>Nenhuma categoria criada ainda. Ex: Marketing 📣, Software 💻, Viagens ✈️…</div>
                                    ) : (
                                        <div style={{ display: 'flex', gap: '7px', flexWrap: 'wrap' }}>
                                            {categoriasCustom.map((c) => (
                                                <span key={c.nome} className="badge" style={{ background: 'rgba(10,132,255,0.1)', color: '#0A6FDB', display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '12px', padding: '7px 12px' }}>
                                                    {c.emoji || '🔖'} {c.nome}
                                                    <span style={{ cursor: 'pointer', fontWeight: 900 }} title="Excluir categoria" onClick={() => removerCategoria(c.nome)}>✕</span>
                                                </span>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Extrato (Sálvia) */}
                                <div className="config-secao">
                                    <h4>🏦 Extrato importado (Sálvia)</h4>
                                    <div className="desc">Gerencie os extratos já importados. Excluir um extrato remove os movimentos dele — as contas conciliadas continuam, só o vínculo é desfeito.</div>
                                    {origensExtrato.length === 0 ? (
                                        <div style={{ fontSize: '12px', color: 'var(--texto-sec)', fontWeight: 600, marginBottom: '8px' }}>Nenhum extrato importado ainda.</div>
                                    ) : (
                                        origensExtrato.map(([origem, info]) => (
                                            <div key={origem} className="file-item" style={{ marginBottom: '8px' }}>
                                                <div className="file-icon">🏦</div>
                                                <div style={{ flex: 1, minWidth: 0 }}>
                                                    <div className="file-name">{origem}</div>
                                                    <div className="file-size">{info.qtd} movimentos · {fmtData(info.min)} a {fmtData(info.max)}</div>
                                                </div>
                                                <button className="icon-btn excluir" title="Excluir este extrato" onClick={() => excluirExtratoPorArquivo(origem)}>🗑️</button>
                                            </div>
                                        ))
                                    )}
                                    {(caixa.movs || []).length > 0 && (
                                        <button className="btn-sm" style={{ background: 'rgba(255,59,48,0.1)', color: '#D70015' }} onClick={excluirExtratoTudo}>🗑️ Apagar todos os movimentos</button>
                                    )}
                                </div>

                                {/* Taxas bancárias */}
                                <div className="config-secao">
                                    <h4>🏷️ Taxas bancárias (Sálvia)</h4>
                                    <div className="desc">Cria uma conta separada no CRM (categoria <b>Taxas bancárias</b>, já paga e conciliada) para cada tarifa do extrato — assim elas aparecem nos relatórios de contas e na prestação de contas, separadas das despesas normais.</div>
                                    <div className="check-row" style={{ marginBottom: '10px' }} onClick={() => setCaixa((cx) => ({ ...cx, gerarContasTaxas: !cx.gerarContasTaxas }))}>
                                        <div className={`caixa ${caixa.gerarContasTaxas ? 'on' : ''}`}>{caixa.gerarContasTaxas ? '✓' : ''}</div>
                                        <div>
                                            Criar automaticamente ao importar extrato
                                            <small>Toda taxa detectada vira uma conta na hora da importação</small>
                                        </div>
                                    </div>
                                    <button className="btn-sm primary" onClick={gerarContasTaxasAgora}>🏷️ Gerar contas das taxas existentes</button>
                                </div>

                                {/* Backup */}
                                <div className="config-secao">
                                    <h4>💾 Backup local</h4>
                                    <div className="desc">Exporta todas as contas (Sálvia + Silxan) em um arquivo JSON. Guarde no Drive ou no computador — é sua rede de segurança.</div>
                                    <div className="btn-group">
                                        <button className="btn-sm primary" onClick={exportarBackup}>⬇️ Exportar backup</button>
                                        <button className="btn-sm" onClick={() => backupRef.current.click()}>⬆️ Restaurar backup</button>
                                    </div>
                                </div>

                                {/* PWA */}
                                <div className="config-secao">
                                    <h4>📱 Instalar como app</h4>
                                    <div className="desc">
                                        <b>Android/Chrome:</b> menu ⋮ → "Adicionar à tela inicial" (ou "Instalar app").<br />
                                        <b>iPhone/Safari:</b> botão Compartilhar → "Adicionar à Tela de Início".<br />
                                        O CRM abre em tela cheia, como um app de verdade. Com o arquivo <code>sw.js</code> no mesmo diretório do site, ele também funciona offline.
                                    </div>
                                </div>

                                <div className="form-buttons">
                                    <button className="cancelar" onClick={() => setConfigAberta(false)}>Fechar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Modal de revisão do extrato ── */}
                    {revisaoExtrato && (
                        <div className="modal-overlay" onClick={() => setRevisaoExtrato(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '640px' }}>
                                <div className="sheet-handle"></div>
                                <h2>🏦 Revisar extrato</h2>

                                <div className="resumo-pills">
                                    <div className="resumo-pill">Movimentos<b>{revisaoExtrato.itens.length}</b></div>
                                    <div className="resumo-pill">Entradas<b style={{ color: '#1E9A46' }}>R$ {fmtValor(revisaoExtrato.itens.filter((i) => i.incluir && i.mov.valor > 0).reduce((s, i) => s + i.mov.valor, 0))}</b></div>
                                    <div className="resumo-pill">Saídas<b style={{ color: '#D70015' }}>R$ {fmtValor(Math.abs(revisaoExtrato.itens.filter((i) => i.incluir && i.mov.valor < 0).reduce((s, i) => s + i.mov.valor, 0)))}</b></div>
                                    {revisaoExtrato.saldoOFX != null && <div className="resumo-pill">Saldo no extrato<b>R$ {fmtValor(revisaoExtrato.saldoOFX)}</b></div>}
                                </div>

                                {revisaoExtrato.distribuicao && revisaoExtrato.distribuicao.length > 0 && (
                                    <div className="alerta-revisao" style={{ background: 'rgba(10,132,255,0.08)', borderColor: 'rgba(10,132,255,0.3)', color: '#0A6FDB' }}>
                                        📅 <b>Movimentos por mês:</b> {revisaoExtrato.distribuicao.map(([k, n]) => {
                                            const [a, mm] = k.split('-').map(Number);
                                            return new Date(a, mm - 1, 1).toLocaleString('pt-BR', { month: 'short' }).replace('.', '') + '/' + String(a).slice(2) + ' (' + n + ')';
                                        }).join(' · ')} — se algum mês estiver estranho, cancele e me avise.
                                    </div>
                                )}

                                {revisaoExtrato.soEntradas && (
                                    <div className="alerta-revisao" style={{ background: 'rgba(255,59,48,0.1)', borderColor: 'rgba(255,59,48,0.35)', color: '#B91C1C' }}>
                                        🚨 <b>Todos os movimentos vieram como entrada</b> — provavelmente seu banco marca débitos de outro jeito. Toque no valor de qualquer movimento para inverter entre entrada e saída. Se forem muitos, prefira exportar o extrato em <b>OFX</b>, que nunca erra o sinal.
                                    </div>
                                )}

                                {revisaoExtrato.itens.some((i) => i.duplicada) && (
                                    <div className="alerta-revisao">
                                        ⚠️ Movimentos que já existem no CRM vieram desmarcados para evitar duplicidade.
                                    </div>
                                )}

                                <div style={{ maxHeight: '44vh', overflowY: 'auto', marginBottom: '6px' }}>
                                    {revisaoExtrato.itens.map((it) => (
                                        <div key={it.chave} className={`rev-item ${!it.incluir ? 'fora' : ''}`} style={{ padding: '10px 12px' }}>
                                            <div className="rev-topo" style={{ marginBottom: 0 }}>
                                                <button className={`rev-check ${it.incluir ? 'on' : ''}`} onClick={() => setRevisaoExtrato((r) => ({ ...r, itens: r.itens.map((x) => x.chave === it.chave ? { ...x, incluir: !x.incluir } : x) }))}>
                                                    {it.incluir ? '✓' : ''}
                                                </button>
                                                <div className="rev-arquivo" style={{ color: 'var(--texto)' }}>
                                                    {fmtData(it.mov.data)} · {it.mov.descricao}{it.mov.dcto ? ' · Dcto ' + it.mov.dcto : ''}
                                                </div>
                                                <div className="rev-flags">
                                                    {it.duplicada && <span className="badge juros">já importada</span>}
                                                    {it.mov.valor < 0 && ehTaxaBancaria(it.mov) && <span className="badge" style={{ background: 'rgba(175,82,222,0.13)', color: '#7C3AED' }}>🏷️</span>}
                                                    <button
                                                        title="Tocar para inverter entrada ↔ saída"
                                                        onClick={() => setRevisaoExtrato((r) => ({ ...r, itens: r.itens.map((x) => x.chave === it.chave ? { ...x, mov: { ...x.mov, valor: -x.mov.valor } } : x) }))}
                                                        style={{ border: 'none', cursor: 'pointer', fontWeight: 800, fontSize: '12.5px', padding: '5px 10px', borderRadius: '999px', whiteSpace: 'nowrap', background: it.mov.valor > 0 ? 'rgba(52,199,89,0.14)' : 'rgba(255,59,48,0.11)', color: it.mov.valor > 0 ? '#1E9A46' : '#D70015' }}>
                                                        {it.mov.valor > 0 ? '+' : '−'} R$ {fmtValor(Math.abs(it.mov.valor))} ⇄
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="form-buttons">
                                    <button className="cancelar" onClick={() => setRevisaoExtrato(null)}>Cancelar</button>
                                    <button className="salvar" onClick={confirmarExtrato}>
                                        ✅ Importar {revisaoExtrato.itens.filter((i) => i.incluir).length} movimentos
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Input oculto — extrato bancário */}
                    <input ref={extratoRef} type="file" accept=".ofx,.qfx,.csv,.xlsx,.xls,.txt,.pdf" style={{ display: 'none' }} onChange={(e) => { processarExtrato(e.target.files[0]); e.target.value = ''; }} />

                    {lendoExtrato && (
                        <div className="modal-overlay">
                            <div style={{ background: '#fff', borderRadius: '20px', padding: '28px 36px', fontWeight: 800, fontSize: '15px', color: 'var(--escuro)', boxShadow: '0 10px 40px rgba(0,0,0,0.3)' }}>
                                🏦 Lendo o extrato…
                            </div>
                        </div>
                    )}

                    {/* Input oculto — restaurar backup */}
                    <input ref={backupRef} type="file" accept=".json,application/json" style={{ display: 'none' }} onChange={(e) => { importarBackup(e.target.files[0]); e.target.value = ''; }} />

                    {/* ── Modal de revisão dos boletos importados ── */}
                    {revisao && (
                        <div className="modal-overlay" onClick={() => setRevisao(null)}>
                            <div className="modal" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '680px' }}>
                                <div className="sheet-handle"></div>
                                <h2>🤖 Revisar boletos importados</h2>

                                <div className="alerta-revisao">
                                    ⚠️ Confira os dados extraídos antes de confirmar. Você pode corrigir qualquer campo, desmarcar boletos que não quer importar, e só então tudo é criado de uma vez — cada conta já sai com o boleto anexado.
                                </div>

                                {revisao.map((it) => (
                                    <div key={it.chave} className={`rev-item ${!it.incluir ? 'fora' : ''} ${it.incluir && (!it.form.fornecedor || !it.form.valor || !it.form.vencimento) ? 'incompleto' : ''}`}>
                                        <div className="rev-topo">
                                            <button className={`rev-check ${it.incluir ? 'on' : ''}`} onClick={() => alternarIncluir(it.chave)} title={it.incluir ? 'Não importar este' : 'Incluir na importação'}>
                                                {it.incluir ? '✓' : ''}
                                            </button>
                                            <div className="rev-arquivo">📕 {it.file.name}</div>
                                            <div className="rev-flags">
                                                {it.duplicada && <span className="badge juros">⚠️ possível duplicada</span>}
                                                {!it.completo && <span className="badge pendente" title={it.motivoErro || 'Alguns campos não foram lidos'}>🔍 conferir dados</span>}
                                                {it.completo && !it.duplicada && <span className="badge pago">🤖 leitura ok</span>}
                                            </div>
                                        </div>
                                        <div className="rev-grid">
                                            <input className={`rev-forn ${it.incluir && !it.form.fornecedor ? 'faltando' : ''}`} placeholder="Fornecedor" value={it.form.fornecedor} onChange={(e) => atualizarRevisao(it.chave, 'fornecedor', e.target.value)} />
                                            <input className={it.incluir && !it.form.valor ? 'faltando' : ''} type="number" step="0.01" inputMode="decimal" placeholder="Valor" value={it.form.valor} onChange={(e) => atualizarRevisao(it.chave, 'valor', e.target.value)} />
                                            <input className={it.incluir && !it.form.vencimento ? 'faltando' : ''} type="date" value={it.form.vencimento} onChange={(e) => atualizarRevisao(it.chave, 'vencimento', e.target.value)} />
                                            <select className="rev-forn" value={it.form.categoria} onChange={(e) => atualizarRevisao(it.chave, 'categoria', e.target.value)} style={{ gridColumn: '1 / -1' }}>
                                                <option value="">Categoria (opcional)…</option>
                                                {listaCategoriasContas.map((cat) => (
                                                    <option key={cat} value={cat}>{catInfo(cat).emoji} {cat}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>
                                ))}

                                <div className="form-buttons">
                                    <button className="cancelar" onClick={() => setRevisao(null)}>Cancelar</button>
                                    <button className="salvar" onClick={confirmarImportacaoBoletos}>
                                        ✅ Confirmar e criar {revisao.filter((it) => it.incluir).length} {revisao.filter((it) => it.incluir).length === 1 ? 'conta' : 'contas'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Input oculto — importação de boletos em lote */}
                    <input ref={boletosRef} type="file" accept=".pdf,application/pdf" multiple style={{ display: 'none' }} onChange={(e) => { processarBoletos(e.target.files); e.target.value = ''; }} />

                    {lendoBoletos && (
                        <div className="modal-overlay">
                            <div style={{ background: '#fff', borderRadius: '20px', padding: '28px 36px', fontWeight: 800, fontSize: '15px', color: 'var(--escuro)', boxShadow: '0 10px 40px rgba(0,0,0,0.3)' }}>
                                🤖 Lendo os boletos…
                            </div>
                        </div>
                    )}

                    {toast && <div className="toast">{toast}</div>}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<CRMFinanceiro />);
    </script>
</body>
</html>
