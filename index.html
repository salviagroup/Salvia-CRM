                    mapa[t].total = arred(mapa[t].total + valorEfetivo(c));
                    mapa[t].qtd++;
                });
                return Object.entries(mapa).sort((a, b) => b[1].total - a[1].total);
            }, [contasDoMes]);

            /* ── Relatório de situação das contas ── */
            const [relSitFiltro, setRelSitFiltro] = useState('todas');
            const [relSitAno, setRelSitAno] = useState(false);

            const situacaoContas = useMemo(() => {
                const base = contasEmpresa.filter((c) => {
                    const iso = paraISO(c.vencimento);
                    if (!iso) return false;
                    const [a, m] = iso.split('-').map(Number);
                    if (a !== mesAtual.getFullYear()) return false;
                    return relSitAno ? true : m === mesAtual.getMonth() + 1;
                }).sort((x, y) => (paraISO(x.vencimento) || '').localeCompare(paraISO(y.vencimento) || ''));

                const pagas = base.filter((c) => c.status === 'pago');
                const vencidas = base.filter(estaVencida);
                const pendentes = base.filter((c) => c.status !== 'pago' && !estaVencida(c));
                const comAtraso = pagas.filter((c) => (c.diasAtraso || 0) > 0 || (c.juros || 0) > 0);
                const totPagas = arred(pagas.reduce((s, c) => s + valorEfetivo(c), 0));
                const totPendentes = arred(pendentes.reduce((s, c) => s + c.valor, 0));
                const totVencidas = arred(vencidas.reduce((s, c) => s + c.valor, 0));
                const totJuros = arred(base.reduce((s, c) => s + (c.juros || 0), 0));
                const percentualEmDia = pagas.length ? Math.round(((pagas.length - comAtraso.length) / pagas.length) * 100) : 100;

                const lista = relSitFiltro === 'pagas' ? pagas
                    : relSitFiltro === 'pendentes' ? pendentes
                    : relSitFiltro === 'vencidas' ? vencidas
                    : relSitFiltro === 'atraso' ? comAtraso
                    : base;

                return { todas: base, pagas, pendentes, vencidas, comAtraso, totPagas, totPendentes, totVencidas, totJuros, percentualEmDia, lista };
            }, [contasEmpresa, mesAtual, relSitAno, relSitFiltro]);

            const fluxoMensal = useMemo(() => {
                if (empresa !== 'salvia') return [];
                const mapa = {};
                (caixa.movs || []).forEach((m) => {
                    const chave = m.data.slice(0, 7);
                    if (!mapa[chave]) mapa[chave] = { entradas: 0, saidas: 0, taxas: 0, qtd: 0 };
                    mapa[chave].qtd++;
                    if (m.valor > 0) mapa[chave].entradas += m.valor;
                    else {
                        mapa[chave].saidas += Math.abs(m.valor);
                        if (ehTaxaBancaria(m)) mapa[chave].taxas += Math.abs(m.valor);
                    }
                });
                return Object.entries(mapa).sort((a, b) => b[0].localeCompare(a[0]));
            }, [empresa, caixa.movs]);

            const irParaContas = (filtro) => {
                setFiltroStatus(filtro);
                setBusca('');
                setAba('contas');
            };
            // Filtra direto no Início, sem sair da tela
            const filtrarNoInicio = (filtro) => {
                setFiltroInicio(filtro === filtroInicio ? 'todas' : filtro);
                setFiltroDia('todos');
            };

            const verMes = (d) => {
                setMesAtual(new Date(d.getFullYear(), d.getMonth(), 1));
                setFiltroStatus('todas');
                setAba('contas');
            };

            /* ── Linha de conta ── */
            const ContaLinha = ({ c }) => {
                const info = catInfo(c.categoria);
                const vencida = estaVencida(c);
                return (
                    <div className={`conta-card ${c.status === 'pago' ? 'paga' : ''}`}>
                        <div className="conta-avatar" style={{ background: info.bg }}>{info.emoji}</div>
                        <div className="conta-info">
                            <div className="conta-nome">{c.fornecedor}</div>
                            <div className="conta-meta">
                                <span>📅 {fmtData(c.vencimento)}</span>
                                <span className={`badge ${vencida ? 'vencido' : c.status}`}>
                                    {vencida ? '🔴 Vencida' : c.status === 'pago' ? '✅ Paga' : c.status === 'boleto_extraido' ? '📥 Extraído' : '⏳ Pendente'}
                                </span>
                                {c.parcelaTotal > 1 && <span className="badge parcela">🔢 {c.parcelaNum}/{c.parcelaTotal}</span>}
                                {c.recorrente && <span className="badge recorrente">🔁 mensal</span>}
                                {mesEstaFechado(paraISO(c.vencimento)) && <span className="badge" style={{ background: 'rgba(52,199,89,0.13)', color: '#1E9A46' }}>🔒 fechado</span>}
                                {c.movConciliado && <span className="badge pago">🏦 confirmada no extrato</span>}
                                {(c.juros || 0) > 0 && <span className="badge juros">+ R$ {fmtValor(c.juros)} juros</span>}
                                {(c.comprovanteDrive || c.comprovanteId) && (
                                    <button className="comprov-link" title="Abrir comprovante de pagamento" onClick={() => abrirComprovante(c)}>🧾 comprovante</button>
                                )}
                            </div>
                        </div>
                        <div className="conta-valor" style={{ color: vencida ? '#D70015' : 'var(--texto)' }}>
                            R$ {fmtValor(valorEfetivo(c))}
                        </div>
                        <div className="conta-acoes">
                            <button className="icon-btn extrair" title="Extrair boleto (baixar anexo + copiar linha digitável)" onClick={() => extrairBoleto(c)}>📥</button>
                            {c.status !== 'pago' ? (
                                <button className="icon-btn pagar" title="Registrar pagamento" onClick={() => abrirPagamento(c)}>✓</button>
                            ) : (
                                <button className="icon-btn" title="Desfazer pagamento (voltar para pendente)" onClick={() => desfazerPagamento(c)}>↩️</button>
                            )}
                            <button className="icon-btn editar-btn" title="Editar" onClick={() => abrirEdicao(c)}>✏️</button>
                            <button className="icon-btn excluir" title="Excluir" onClick={() => excluirConta(c)}>🗑️</button>
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    {/* ── Barra superior ── */}
                    <nav className="navbar">
                        <div className="logo">
                            <div className="logo-badge">{emojiTema}</div>
                            <span>{ehSilxan ? 'Silxan' : 'Sálvia Group'}</span>
                        </div>
                        <div className="segmented">
                            {ABAS.map((a) => (
                                <button key={a.id} className={aba === a.id ? 'active' : ''} onClick={() => setAba(a.id)}>{a.label}</button>
                            ))}
                        </div>
                        <div className="nav-right">
                            <div className="empresa-pill">
                                <button className={!ehSilxan ? 'active' : ''} onClick={() => setEmpresa('salvia')}>🌿 Sálvia</button>
                                <button className={ehSilxan ? 'active' : ''} onClick={() => setEmpresa('silxan')}>💗 Silxan</button>
                            </div>
                            <button className="btn-config" title={fb.conectado ? 'Sincronização ativa · Configurações' : 'Configurações'} onClick={() => setConfigAberta(true)}>
                                ⚙️
                                <span className={`sync-dot ${fb.erro ? 'erro' : fb.conectado ? 'on' : 'off'}`}></span>
                            </button>
                            <button className="btn-add" onClick={abrirNovaConta}>＋ Conta</button>
                        </div>
                    </nav>

                    <main className="main">
                        <div>
                            <div className="greeting">{saudacao} {emojiTema}</div>
                            <div className="subtext">{dataHoje} · {nomeEmpresa}</div>
                        </div>

                        <div className="mes-nav">
                            <button className="seta" onClick={() => {
                                const anos = (aba === 'caixa' && periodoCaixa === 'ano') ? 12 : 1;
                                setMesAtual(new Date(mesAtual.getFullYear(), mesAtual.getMonth() - anos, 1));
                                setFiltroDia('todos');
                            }} aria-label="Anterior">‹</button>
                            <span className="mes-label">{(aba === 'caixa' && periodoCaixa === 'ano') ? 'Ano ' + mesAtual.getFullYear() : mesAtual.toLocaleString('pt-BR', { month: 'long', year: 'numeric' })}</span>
                            <button className="seta" onClick={() => {
                                const anos = (aba === 'caixa' && periodoCaixa === 'ano') ? 12 : 1;
                                setMesAtual(new Date(mesAtual.getFullYear(), mesAtual.getMonth() + anos, 1));
                                setFiltroDia('todos');
                            }} aria-label="Próximo">›</button>
                            <button className="mes-hoje" onClick={() => { setMesAtual(new Date()); setFiltroDia('todos'); }}>Hoje</button>
                        </div>

                        {/* ══════════ DASHBOARD ══════════ */}
                        {aba === 'dashboard' && (
                            <>
                                <div className="stats-grid">
                                    <div className="stat-widget total" onClick={() => irParaContas('todas')} title="Ver todas as contas do mês">
                                        <div className="stat-top">
                                            <span className="stat-label">Total do mês</span>
                                            <span className="stat-emoji">💰</span>
                                        </div>
                                        <div className="stat-value">R$ {fmtValor(totalMes)}</div>
                                        <div>
                                            <div className="stat-desc">{contasDoMes.length} contas em {mesNome}{variacao != null ? ` · ${variacao >= 0 ? '▲' : '▼'} ${Math.abs(variacao).toFixed(1)}% vs mês anterior` : ''}</div>
                                            <div className="stat-hint">Tocar para ver relatório ›</div>
                                        </div>
                                    </div>
                                    <div className="stat-widget pago" onClick={() => irParaContas('pagas')} title="Ver contas pagas do mês">
                                        <div className="stat-top">
                                            <span className="stat-label">Pago</span>
                                            <span className="stat-emoji">✅</span>
                                        </div>
                                        <div className="stat-value">R$ {fmtValor(totalPago)}</div>
                                        <div>
                                            <div className="stat-desc">{contasDoMes.filter((c) => c.status === 'pago').length} quitadas{jurosDoMes > 0 ? ` · R$ ${fmtValor(jurosDoMes)} em juros` : ''}</div>
                                            <div className="stat-hint">Tocar para ver relatório ›</div>
                                        </div>
                                    </div>
                                    <div className="stat-widget pendente" onClick={() => irParaContas('pendentes')} title="Ver contas a pagar do mês">
                                        <div className="stat-top">
                                            <span className="stat-label">A pagar</span>
                                            <span className="stat-emoji">⏳</span>
                                        </div>
                                        <div className="stat-value">R$ {fmtValor(totalPendente)}</div>
                                        <div>
                                            <div className="stat-desc">{contasDoMes.filter((c) => c.status !== 'pago').length} em aberto{vencidas.length > 0 ? ` · inclui ${vencidas.length} vencida${vencidas.length > 1 ? 's' : ''}` : ''}</div>
                                            <div className="stat-hint">Tocar para ver relatório ›</div>
                                        </div>
                                    </div>
                                    <div className="stat-widget vencido" onClick={() => irParaContas('vencidas')} title="Ver contas vencidas do mês">
                                        <div className="stat-top">
                                            <span className="stat-label">Vencidas</span>
                                            <span className="stat-emoji">🚨</span>
                                        </div>
                                        <div className="stat-value">R$ {fmtValor(totalVencido)}</div>
                                        <div>
                                            <div className="stat-desc">{vencidas.length === 0 ? 'Tudo em dia 🎉' : `${vencidas.length} exigem atenção · já contadas em "A pagar"`}</div>
                                            <div className="stat-hint">Tocar para ver relatório ›</div>
                                        </div>
                                    </div>
                                    {empresa === 'salvia' && (
                                        <div className="stat-widget" style={{ background: 'linear-gradient(140deg, #40C8B0 0%, #0D8A73 60%, #085C4D 100%)' }} onClick={() => setAba('caixa')} title="Ver o caixa">
                                            <div className="stat-top">
                                                <span className="stat-label">Recebido · {mesNome}</span>
                                                <span className="stat-emoji">💵</span>
                                            </div>
                                            <div className="stat-value">R$ {fmtValor(entradasMes)}</div>
                                            <div>
                                                <div className="stat-desc">{(caixa.movs || []).length === 0 ? 'importe o extrato no Caixa' : `entradas no extrato · resultado R$ ${fmtValor(entradasMes - saidasMes)}`}</div>
                                                <div className="stat-hint">Tocar para abrir o Caixa ›</div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="quick-actions">
                                    <div className="action-card" onClick={abrirNovaConta}>
                                        <div className="action-icon ai-green">➕</div>
                                        <div className="action-label">Nova conta</div>
                                    </div>
                                    <div className="action-card" onClick={() => setAba('contas')}>
                                        <div className="action-icon ai-blue">📋</div>
                                        <div className="action-label">Contas</div>
                                    </div>
                                    {empresa === 'salvia' && (
                                        <div className="action-card" onClick={() => setAba('caixa')}>
                                            <div className="action-icon ai-pink">💰</div>
                                            <div className="action-label">Caixa</div>
                                        </div>
                                    )}
                                    <div className="action-card" onClick={() => setAba('relatorios')}>
                                        <div className="action-icon ai-orange">📈</div>
                                        <div className="action-label">Relatórios</div>
                                    </div>
                                </div>

                                {/* Card único: contas do mês com busca e filtros */}
                                <div className="data-section">
                                    <div className="section-header">
                                        <h3>{buscaInicio.trim() && buscaTodoPeriodo ? 'Busca em todos os meses' : `Contas de ${mesNome}`}</h3>
                                        <div className="btn-group">
                                            <select className="select-ios" value={filtroDia} onChange={(e) => setFiltroDia(e.target.value)}>
                                                <option value="todos">📅 Todos os dias</option>
                                                {diasComContas.map((d) => (
                                                    <option key={d} value={d}>Dia {d}</option>
                                                ))}
                                            </select>
                                            <button className="btn-sm primary" onClick={() => setAba('contas')}>Ver detalhes</button>
                                        </div>
                                    </div>

                                    <div className="filtros-bar">
                                        <div className="busca-wrap">
                                            <span className="busca-icon">🔍</span>
                                            <input placeholder="Buscar conta por fornecedor, categoria ou valor…" value={buscaInicio} onChange={(e) => setBuscaInicio(e.target.value)} />
                                            {buscaInicio && (
                                                <button onClick={() => setBuscaInicio('')} title="Limpar busca"
                                                    style={{ position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)', border: 'none', background: 'var(--ios-gray5)', borderRadius: '50%', width: '20px', height: '20px', cursor: 'pointer', fontSize: '11px', lineHeight: 1, color: 'var(--texto-sec)' }}>✕</button>
                                            )}
                                        </div>
                                        <div className="chips">
                                            <button className={`chip ${filtroInicio === 'todas' ? 'active' : ''}`} onClick={() => setFiltroInicio('todas')}>Todas</button>
                                            <button className={`chip c-orange ${filtroInicio === 'pendentes' ? 'active' : ''}`} onClick={() => setFiltroInicio('pendentes')}>⏳ A pagar</button>
                                            <button className={`chip c-red ${filtroInicio === 'vencidas' ? 'active' : ''}`} onClick={() => setFiltroInicio('vencidas')}>🔴 Vencidas</button>
                                            <button className={`chip c-green ${filtroInicio === 'pagas' ? 'active' : ''}`} onClick={() => setFiltroInicio('pagas')}>✅ Pagas</button>
                                        </div>
                                    </div>

                                    {buscaInicio.trim() && (
                                        <div className="check-row" style={{ marginBottom: '14px', padding: '10px 13px' }} onClick={() => setBuscaTodoPeriodo(!buscaTodoPeriodo)}>
                                            <div className={`caixa ${buscaTodoPeriodo ? 'on' : ''}`} style={{ width: '20px', height: '20px', fontSize: '12px' }}>{buscaTodoPeriodo ? '✓' : ''}</div>
                                            <div style={{ fontSize: '12.5px' }}>
                                                Buscar em todos os meses
                                                <small>Ignora o mês selecionado e procura no histórico inteiro</small>
                                            </div>
                                        </div>
                                    )}

                                                    {buscaTodoPeriodo && buscaInicio.trim() && (

                                                </div>

                        {/* ══════════ CONTAS ══════════ */}
                        {aba === 'contas' && (
                            <div className="data-section">

                                    <h3>Contas · {mesNome}</h3>
                                    <div className="btn-group">
                                        <button className="btn-sm" onClick={() => boletosRef.current.click()}>🤖 Boletos</button>

                                        <button className="btn-sm" onClick={exportarCSV}>📋 CSV</button>

                                <div className="filtros-bar">
                                    <div className="busca-wrap">
                                        <span className="busca-icon">🔍</span>
                                        <input placeholder="Buscar fornecedor ou categoria…" value={busca} onChange={(e) => setBusca(e.target.value)} />

                                        <button className={`chip ${filtroStatus === 'todas' ? 'active' : ''}`} onClick={() => setFiltroStatus('todas')}>Todas</button>
                                        <button className={`chip c-orange ${filtroStatus === 'pendentes' ? 'active' : ''}`} onClick={() => setFiltroStatus('pendentes')}>A pagar</button>
                                        <button className={`chip c-red ${filtroStatus === 'vencidas' ? 'active' : ''}`} onClick={() => setFiltroStatus('vencidas')}>Vencidas</button>
                                        <button className={`chip c-green ${filtroStatus === 'pagas' ? 'active' : ''}`} onClick={() => setFiltroStatus('pagas')}>Pagas</button>
                                    </div>
                                </div>

                                {contasFiltradas.length === 0 ? (
                                    <div className="empty-state">
                                        <div className="big">🔍</div>
                                        <p>Nada por aqui</p>
                                        <small>Ajuste a busca, os filtros ou o mês selecionado</small>
                                    </div>
                                ) : (
                                    contasFiltradas.map((c) => (
                                        <div key={c.id}>
                                            <ContaLinha c={c} />
                                            {c.linhaDigitavel && (
                                                <div className="linha-digitavel" style={{ margin: '0 0 8px 58px' }} onClick={() => copiarLinha(c.linhaDigitavel)} title="Tocar para copiar">
                                                    <span>📋</span>
                                                    <span>{c.linhaDigitavel}</span>
                                                </div>
                                            )}
                                        </div>
                                    ))
                                )}
                            </div>
                        )}

                        {/* ══════════ CAIXA (só Sálvia) ══════════ */}
                        {aba === 'caixa' && empresa === 'salvia' && (
                            <>
                                {/* Visão: mês ou ano inteiro */}
                                <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '16px' }}>
                                    <div className="chips">
                                        <button className={`chip ${periodoCaixa === 'mes' ? 'active' : ''}`} onClick={() => setPeriodoCaixa('mes')}>📅 Visão mensal</button>
                                        <button className={`chip c-blue ${periodoCaixa === 'ano' ? 'active' : ''}`} onClick={() => setPeriodoCaixa('ano')}>🗓️ Ano {mesAtual.getFullYear()}</button>
                                    </div>
                                </div>
                                {/* Cards do caixa */}
                                <div className="stats-grid">
                                    <div className="stat-widget total" onClick={() => { setSaldoEditando(true); setSaldoTxt(caixa.saldoAtual != null ? String(caixa.saldoAtual) : ''); }} title="Tocar para editar o saldo">
                                        <div className="stat-top">
                                            <span className="stat-label">Saldo em conta</span>
                                            <span className="stat-emoji">🏦</span>
                                        </div>
                                        <div className="stat-value">{caixa.saldoAtual != null ? 'R$ ' + fmtValor(caixa.saldoAtual) : '— definir —'}</div>
                                        <div>
                                            <div className="stat-desc">{caixa.saldoData ? 'em ' + fmtData(caixa.saldoData) : 'importe um OFX ou informe manualmente'}</div>
                                            <div className="stat-hint">Tocar para editar ›</div>
                                        </div>
                                    </div>
                                    <div className="stat-widget pago">
                                        <div className="stat-top">
                                            <span className="stat-label">Entradas · {rotuloPeriodo || mesNome}</span>
                                            <span className="stat-emoji">📈</span>
                                        </div>
                                        <div className="stat-value">R$ {fmtValor(entradasMes)}</div>
                                        <div className="stat-desc">{movsDoMes.filter((m) => m.valor > 0).length} créditos no extrato</div>
                                    </div>
                                    <div className="stat-widget pendente">
                                        <div className="stat-top">
                                            <span className="stat-label">Saídas · {rotuloPeriodo || mesNome}</span>
                                            <span className="stat-emoji">📉</span>
                                        </div>
                                        <div className="stat-value">R$ {fmtValor(saidasMes)}</div>
                                        <div className="stat-desc">{movsDoMes.filter((m) => m.valor < 0).length} débitos{taxasMes > 0 ? ` · R$ ${fmtValor(taxasMes)} em taxas 🏷️` : ''}</div>
                                    </div>
                                    <div className={`stat-widget ${entradasMes - saidasMes >= 0 ? 'pago' : 'vencido'}`} style={{ background: entradasMes - saidasMes >= 0 ? 'linear-gradient(140deg, #40C8B0, #0D8A73)' : undefined }}>
                                        <div className="stat-top">
                                            <span className="stat-label">Resultado · {rotuloPeriodo || mesNome}</span>
                                            <span className="stat-emoji">{entradasMes - saidasMes >= 0 ? '💚' : '🚨'}</span>
                                        </div>
                                        <div className="stat-value">R$ {fmtValor(entradasMes - saidasMes)}</div>
                                        <div className="stat-desc">{entradasMes - saidasMes >= 0 ? 'entrou mais do que saiu' : 'saiu mais do que entrou'}</div>

                                {saldoEditando && (

                                        <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', paddingBottom: '10px' }}>

                                            <button className="btn-sm primary" onClick={salvarSaldo}>Salvar</button>
                                            <button className="btn-sm" onClick={() => setSaldoEditando(false)}>Cancelar</button>
                                        </div>
                                    </div>
                                )}

                                {saldoDivergente && (
                                    <div className="data-section" style={{ border: '1.5px solid rgba(255,149,0,0.45)' }}>

                                            Você informou <b>R$ {fmtValor(caixa.saldoAtual)}</b>, mas o último lançamento do extrato ({fmtData(saldoDoExtrato.data)}) fecha em <b>R$ {fmtValor(saldoDoExtrato.valor)}</b>.
                                            A projeção usa o saldo informado — corrija para ela ficar confiável.
                                        </div>
                                        <div className="btn-group" style={{ paddingBottom: '10px' }}>
                                            <button className="btn-sm primary" onClick={usarSaldoDoExtrato}>🏦 Usar o saldo do extrato (R$ {fmtValor(saldoDoExtrato.valor)})</button>

                                        </div>
                                    </div>
                                )}

                                {/* Projeção 90 dias */}
                                <div className="data-section">
                                    <div className="section-header">
                                        <h3>🔮 Projeção de caixa · 90 dias</h3>

                                    {!projecao ? (
                                        <div className="empty-state">
                                            <div className="big">🏦</div>
                                            <p>Defina o saldo atual para projetar</p>

                                        </div>
                                    ) : (
                                        <>
                                            {saldoDivergente && (
                                                <div className="alerta-revisao" style={{ marginBottom: '10px' }}>

                                            )}

                                                <div className="alerta-revisao" style={{ background: 'rgba(255,59,48,0.1)', borderColor: 'rgba(255,59,48,0.35)', color: '#B91C1C' }}>

                                                <div className="alerta-revisao" style={{ background: 'rgba(52,199,89,0.1)', borderColor: 'rgba(52,199,89,0.35)', color: '#166534' }}>

                                                </div>
                                            )}

                                            {(() => {
                                                const W = 640, H = 190, PAD = 8;
                                                const serie = projecao.serie;
                                                const vMax = Math.max(...serie, 0), vMin = Math.min(...serie, 0);
                                                const faixa = (vMax - vMin) || 1;
                                                const x = (i) => PAD + (i / 90) * (W - 2 * PAD);
                                                const y = (v) => PAD + (1 - (v - vMin) / faixa) * (H - 2 * PAD);
                                                const caminho = serie.map((v, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
                                                const area = caminho + ` L ${x(90).toFixed(1)} ${y(Math.max(vMin, 0)).toFixed(1)} L ${x(0).toFixed(1)} ${y(Math.max(vMin, 0)).toFixed(1)} Z`;
                                                const corLinha = projecao.diaNegativo >= 0 ? '#E8352A' : (ehSilxan ? '#F26BAE' : '#2E9C50');
                                                return (
                                                    <svg viewBox={`0 0 ${W} ${H + 22}`} style={{ width: '100%', height: 'auto' }} role="img" aria-label="Projeção de saldo em 90 dias">
                                                        <defs>
                                                            <linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1">
                                                                <stop offset="0%" stopColor={corLinha} stopOpacity="0.25" />
                                                                <stop offset="100%" stopColor={corLinha} stopOpacity="0.02" />
                                                            </linearGradient>
                                                        </defs>
                                                        {vMin < 0 && <line x1={PAD} x2={W - PAD} y1={y(0)} y2={y(0)} stroke="#FF3B30" strokeDasharray="5 4" strokeWidth="1.4" />}
                                                        <path d={area} fill="url(#gradArea)" />
                                                        <path d={caminho} fill="none" stroke={corLinha} strokeWidth="2.6" strokeLinejoin="round" strokeLinecap="round" />
                                                        {projecao.diaNegativo >= 0 && (
                                                            <circle cx={x(projecao.diaNegativo)} cy={y(serie[projecao.diaNegativo])} r="4.5" fill="#E8352A" stroke="#fff" strokeWidth="1.6" />
                                                        )}
                                                        {[0, 30, 60, 90].map((d) => (
                                                            <text key={d} x={x(d)} y={H + 16} fontSize="10.5" fontWeight="700" fill="#8E8E93" textAnchor={d === 0 ? 'start' : d === 90 ? 'end' : 'middle'}>
                                                                {d === 0 ? 'hoje' : dataDoDia(d)}
                                                            </text>
                                                        ))}
                                                    </svg>
                                                );
                                            })()}

                                            <div className="resumo-pills" style={{ marginTop: '10px' }}>
                                                <div className="resumo-pill">Saídas programadas 90d<b style={{ color: '#D97706' }}>R$ {fmtValor(projecao.totalSaidas90)}</b></div>
                                                <div className="resumo-pill">Média mensal de entradas<b style={{ color: '#1E9A46' }}>R$ {fmtValor(projecao.mediaMensalEntrada)}</b></div>
                                                <div className="resumo-pill">Saldo daqui a 90 dias<b>R$ {fmtValor(projecao.serie[90])}</b></div>
                                            </div>
                                            <p style={{ fontSize: '11.5px', color: 'var(--texto-sec)', fontWeight: 600, padding: '4px 2px 8px' }}>
                                                Conservadora = só o saldo menos as contas a pagar do CRM. Com média de entradas = soma também a média diária de créditos dos últimos 90 dias do extrato — é estimativa, não garantia.
                                            </p>
                                        </>
                                    )}
                                </div>

                                {/* Fechamento: extrato × CRM (só na visão mensal) */}
                                {periodoCaixa === 'mes' && fechamento && fechamento.temExtrato && (
                                    <div className="data-section" style={{ border: fechamento.fechado ? '1.5px solid rgba(52,199,89,0.35)' : '1.5px solid rgba(255,149,0,0.4)' }}>
                                        <div className="section-header">
                                            <h3>{fechamento.fechado ? '✅ Fechamento · ' : '⚠️ Divergência · '}{mesNome}</h3>
                                        </div>
                                        <div className="resumo-pills">
                                            <div className="resumo-pill">Saídas no extrato<b>R$ {fmtValor(fechamento.saidasExtrato)}</b></div>
                                            <div className="resumo-pill">Contas pagas no CRM<b>R$ {fmtValor(fechamento.totalPagasCRM)}</b></div>
                                            <div className="resumo-pill">Diferença<b style={{ color: fechamento.fechado ? '#1E9A46' : '#D97706' }}>R$ {fmtValor(Math.abs(fechamento.diferenca))}</b></div>
                                            {fechamento.taxas > 0 && <div className="resumo-pill">Taxas bancárias<b style={{ color: '#7C3AED' }}>R$ {fmtValor(fechamento.taxas)}</b></div>}
                                        </div>
                                        {fechamento.fechado ? (
                                            <p style={{ fontSize: '12.5px', color: '#166534', fontWeight: 700, padding: '2px 2px 10px' }}>
                                                Os valores do CRM fecham com o extrato — mês conciliado. 🎉
                                            </p>
                                        ) : (
                                            <>
                                                <div className="alerta-revisao" style={{ marginBottom: '10px' }}>
                                                    Os valores não fecham. Toque em cada item para ver e resolver:
                                                    {fechamento.saidasSemConta.length > 0 && (
                                                        <div style={{ marginTop: '7px', cursor: 'pointer', textDecoration: 'underline' }} onClick={() => setDivergenciaAberta(divergenciaAberta === 'saidas' ? null : 'saidas')}>
                                                            {divergenciaAberta === 'saidas' ? '▾' : '▸'} 📉 <b>{fechamento.saidasSemConta.length}</b> {fechamento.saidasSemConta.length === 1 ? 'saída do extrato sem conta registrada' : 'saídas do extrato sem conta registrada'} (R$ {fmtValor(fechamento.valorSaidasSemConta)})
                                                        </div>
                                                    )}
                                                    {fechamento.pagasSemExtrato.length > 0 && (
                                                        <div style={{ marginTop: '7px', cursor: 'pointer', textDecoration: 'underline' }} onClick={() => setDivergenciaAberta(divergenciaAberta === 'pagas' ? null : 'pagas')}>
                                                            {divergenciaAberta === 'pagas' ? '▾' : '▸'} 📋 <b>{fechamento.pagasSemExtrato.length}</b> {fechamento.pagasSemExtrato.length === 1 ? 'conta paga no CRM sem movimento no extrato' : 'contas pagas no CRM sem movimento no extrato'} (R$ {fmtValor(fechamento.valorPagasSemExtrato)})
                                                        </div>
                                                    )}
                                                    {fechamento.taxas > 0 && (
                                                        <div style={{ marginTop: '7px' }}>
                                                            🏷️ R$ {fmtValor(fechamento.taxas)} são taxas bancárias — use "Gerar contas das taxas" em ⚙️ para elas fecharem também.
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Detalhe: saídas sem conta — criar conta com um toque */}
                                                {divergenciaAberta === 'saidas' && fechamento.saidasSemConta.length > 0 && (
                                                    <div style={{ marginBottom: '12px' }}>
                                                        <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: '8px' }}>
                                                            <button className="btn-sm primary" onClick={() => criarContasDeMovimentos(fechamento.saidasSemConta)}>
                                                                ➕ Criar contas de todas ({fechamento.saidasSemConta.length})
                                                            </button>
                                                        </div>
                                                        {fechamento.saidasSemConta.map((m) => (
                                                            <div className="hist-row" key={m.id}>
                                                                <div style={{ width: '58px', fontWeight: 700, fontSize: '12px', whiteSpace: 'nowrap' }}>{fmtData(m.data)}</div>
                                                                <div className="hist-mes" style={{ textTransform: 'none', fontSize: '12.5px', fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.descricao}</div>
                                                                <div className="hist-val vermelho" style={{ width: '92px', textAlign: 'right' }}>−R$ {fmtValor(Math.abs(m.valor))}</div>
                                                                <div style={{ width: '96px', textAlign: 'right' }}>
                                                                    <button className="btn-sm" style={{ padding: '6px 11px', fontSize: '11px' }} onClick={() => criarContasDeMovimentos([m])}>➕ Criar conta</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* Detalhe: contas pagas sem extrato — editar ou desfazer */}
                                                {divergenciaAberta === 'pagas' && fechamento.pagasSemExtrato.length > 0 && (
                                                    <div style={{ marginBottom: '12px' }}>
                                                        <p style={{ fontSize: '11.5px', color: 'var(--texto-sec)', fontWeight: 600, marginBottom: '8px' }}>
                                                            Possíveis causas: paga por outra conta/dinheiro, data de pagamento errada, ou o extrato do período ainda não foi importado.
                                                        </p>
                                                        {fechamento.pagasSemExtrato.map((c) => (
                                                            <div className="hist-row" key={c.id}>
                                                                <div style={{ width: '58px', fontWeight: 700, fontSize: '12px', whiteSpace: 'nowrap' }}>{fmtData(c.pagaEm || c.vencimento)}</div>
                                                                <div className="hist-mes" style={{ textTransform: 'none', fontSize: '12.5px', fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.fornecedor}</div>
                                                                <div className="hist-val verde" style={{ width: '92px', textAlign: 'right' }}>R$ {fmtValor(valorEfetivo(c))}</div>
                                                                <div style={{ width: '104px', textAlign: 'right', display: 'flex', gap: '5px', justifyContent: 'flex-end' }}>
                                                                    <button className="icon-btn" style={{ width: '28px', height: '28px', fontSize: '12px' }} title="Editar conta" onClick={() => abrirEdicao(c)}>✏️</button>
                                                                    <button className="icon-btn" style={{ width: '28px', height: '28px', fontSize: '12px' }} title="Desfazer pagamento (volta a pendente)" onClick={() => desfazerPagamento(c)}>↩️</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </>
                                        )}
                                    </div>
                                )}

                                {/* Movimentos do extrato */}
                                <div className="data-section">
                                    <div className="section-header">
                                        <h3>🏦 Extrato · {rotuloPeriodo || mesNome}</h3>
                                        <div className="btn-group">
                                            <button className="btn-sm" onClick={conciliarAgora}>🔗 Conciliar</button>
                                            <button className="btn-sm" onClick={() => {
                                                const dados = movsDoMes.map((m) => ({
                                                    Data: fmtData(m.data),
                                                    'Lançamento': m.descricao,
                                                    'Dcto.': m.dcto || '',
                                                    'Crédito (R$)': m.valor > 0 ? m.valor : '',
                                                    'Débito (R$)': m.valor < 0 ? -Math.abs(m.valor) : '',
                                                    'Saldo (R$)': m.saldo != null ? m.saldo : '',
                                                    Categoria: m.categoria || '',
                                                    Conciliado: m.conciliadoCom ? nomeContaConciliada(m) : '',
                                                }));
                                                const ws = XLSX.utils.json_to_sheet(dados);
                                                ws['!cols'] = [{ wch: 10 }, { wch: 44 }, { wch: 11 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 16 }, { wch: 20 }];
                                                const wb = XLSX.utils.book_new();
                                                XLSX.utils.book_append_sheet(wb, ws, 'Extrato');
                                                XLSX.writeFile(wb, `Extrato-Salvia-${mesAtual.toLocaleString('pt-BR', { month: 'short', year: 'numeric' }).replace(/[.\s]/g, '-')}.xlsx`);
                                                mostrarToast('📊 Extrato exportado');
                                            }}>📊 Exportar</button>
                                            <button className="btn-sm primary" onClick={() => extratoRef.current.click()}>📥 Importar extrato</button>
                                        </div>
                                    </div>
                                    <div className="filtros-bar">
                                        <div className="busca-wrap">
                                            <span className="busca-icon">🔍</span>

                                                            <td className="dcto-col">{m.dcto || '—'}</td>

                                                                <select className={`cat-select ${!m.categoria ? 'vazia' : ''}`} value={m.categoria || ''} onChange={(e) => setCategoriaMov(m.id, e.target.value)}>

                                                                </select>

                                                            <td>
                                                                <button className="icon-btn excluir" style={{ width: '28px', height: '28px', fontSize: '12px' }} title="Excluir movimento" onClick={() => excluirMovimento(m.id)}>✕</button>

                        {/* ══════════ PENDÊNCIAS (só Sálvia) ══════════ */}
                        {aba === 'pendencias' && empresa === 'salvia' && pendencias && (
                            <>
                                <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '16px', gap: '8px', flexWrap: 'wrap' }}>
                                    <div className="chips">
                                        <button className={`chip ${pendTodoAno ? 'active' : ''}`} onClick={() => setPendTodoAno(true)}>🗓️ Ano {mesAtual.getFullYear()}</button>
                                        <button className={`chip c-blue ${!pendTodoAno ? 'active' : ''}`} onClick={() => setPendTodoAno(false)}>📅 {mesNome}</button>
                                    </div>
                                </div>

                                <div className="data-section">
                                    <div className="section-header">
                                        <h3>🔗 Central de pendências</h3>
                                        <div className="btn-group">
                                            <button className="btn-sm" onClick={atualizarTudo}>🔄 Atualizar</button>
                                            <button className="btn-sm primary" onClick={conciliarAgora}>🔗 Conciliar tudo</button>
                                        </div>
                                    </div>

                                    {totalPendencias === 0 ? (
                                        <div className="empty-state">
                                            <div className="big">🎉</div>
                                            <p>Nenhuma pendência</p>
                                            <small>Tudo conciliado e categorizado neste período</small>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="chips" style={{ marginBottom: '16px' }}>
                                                <button className={`chip c-red ${filtroPend === 'saidas' ? 'active' : ''}`} onClick={() => setFiltroPend('saidas')}>📉 Saídas sem conta ({pendencias.saidas.length})</button>
                                                <button className={`chip c-green ${filtroPend === 'recebidos' ? 'active' : ''}`} onClick={() => setFiltroPend('recebidos')}>💵 Recebidos sem categoria ({pendencias.recebidos.length})</button>
                                                <button className={`chip ${filtroPend === 'taxas' ? 'active' : ''}`} onClick={() => setFiltroPend('taxas')}>🏷️ Taxas ({pendencias.taxas.length})</button>
                                                <button className={`chip c-orange ${filtroPend === 'contas' ? 'active' : ''}`} onClick={() => setFiltroPend('contas')}>📋 Contas sem extrato ({pendencias.contasSemExtrato.length})</button>
                                                <button className={`chip c-blue ${filtroPend === 'tipos' ? 'active' : ''}`} onClick={() => setFiltroPend('tipos')}>🏪 Sem identificação ({pendencias.contasSemTipo.length})</button>
                                            </div>

                                            {/* Saídas do extrato sem conta */}
                                            {filtroPend === 'saidas' && (
                                                pendencias.saidas.length === 0 ? <div className="empty-state"><div className="big">✅</div><p>Todas as saídas têm conta</p></div> : (
                                                    <>
                                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px', flexWrap: 'wrap', gap: '8px' }}>
                                                            <span style={{ fontSize: '12.5px', fontWeight: 700, color: 'var(--texto-sec)' }}>
                                                                Total: R$ {fmtValor(pendencias.saidas.reduce((s, m) => s + Math.abs(m.valor), 0))}
                                                            </span>
                                                            <button className="btn-sm primary" onClick={() => criarContasDeMovimentos(pendencias.saidas)}>➕ Criar contas de todas</button>
                                                        </div>
                                                        {pendencias.saidas.map((m) => (
                                                            <div key={m.id} style={{ background: 'var(--ios-gray6)', borderRadius: '14px', padding: '12px 14px', marginBottom: '10px' }}>
                                                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '9px', flexWrap: 'wrap' }}>
                                                                    <span style={{ fontWeight: 700, fontSize: '12px', whiteSpace: 'nowrap' }}>{fmtData(m.data)}</span>
                                                                    <span style={{ flex: 1, minWidth: '140px', fontWeight: 700, fontSize: '13px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.descricao}</span>
                                                                    <span style={{ fontWeight: 800, fontSize: '13.5px', color: '#D70015', whiteSpace: 'nowrap' }}>−R$ {fmtValor(Math.abs(m.valor))}</span>
                                                                </div>
                                                                <div style={{ display: 'flex', gap: '7px', flexWrap: 'wrap', alignItems: 'center' }}>
                                                                    <button className="btn-sm primary" style={{ padding: '7px 12px', fontSize: '11.5px' }} onClick={() => criarContasDeMovimentos([m])}>➕ Criar conta</button>

                                                                        {contasParaConciliar.map((c) => (
                                                                            <option key={c.id} value={c.id}>{c.fornecedor} · R$ {fmtValor(c.valor)} · {fmtData(c.vencimento)}</option>
                                                                        ))}
                                                                    </select>
                                                                    <button className="btn-sm" style={{ padding: '7px 12px', fontSize: '11.5px' }} onClick={() => alternarTaxaMov(m)}>🏷️ É taxa bancária</button>

                                                                        if (!e.target.value) return;
                                                                        const contaId = Number(e.target.value);
                                                                        const conta = (contas.salvia || []).find((c) => c.id === contaId);
                                                                        if (!conta) return;
                                                                        const trecho = normalizarNome(m.descricao).split(' ').filter((p) => p.length >= 4).slice(0, 2).join(' ');
                                                                        const novos = conta.apelidos ? conta.apelidos + ', ' + trecho : trecho;
                                                                        setContas((prev) => ({ ...prev, salvia: (prev.salvia || []).map((c) => (c.id === contaId ? { ...c, apelidos: novos } : c)) }));
                                                                        mostrarToast(`📝 "${trecho}" salvo como apelido de ${conta.fornecedor} — próximas conciliam sozinhas`);
                                                                        e.target.value = '';
                                                                    }}>
                                                                        <option value="">📝 Ensinar: este nome é de…</option>
                                                                        {[...new Set((contas.salvia || []).map((c) => c.fornecedor))].sort().slice(0, 60).map((nome) => {
                                                                            const c = (contas.salvia || []).find((x) => x.fornecedor === nome);
                                                                            return <option key={c.id} value={c.id}>{nome}</option>;

                                                                    </select>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </>

                                                                Total: R$ {fmtValor(pendencias.recebidos.reduce((s, m) => s + m.valor, 0))}
                                                            </span>
                                                            <button className="btn-sm primary" onClick={() => {
                                                                setCaixa((cx) => ({ ...cx, movs: (cx.movs || []).map((m) => (pendencias.recebidos.some((r) => r.id === m.id) ? { ...m, categoria: 'Comissões' } : m)) }));

                                                            <div key={m.id} className="hist-row">

                                                                <div style={{ width: '150px', textAlign: 'right' }}>
                                                                    <select className="cat-select" value={m.categoria || ''} onChange={(e) => setCategoriaMov(m.id, e.target.value)}>
                                                                        <option value="">Categoria…</option>
                                                                        {listaCategoriasMov.map((c) => <option key={c} value={c}>{c}</option>)}
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </>
                                                )
                                            )}

                                            {/* Taxas detectadas — confirmar ou negar */}
                                            {filtroPend === 'taxas' && (
                                                pendencias.taxas.length === 0 ? <div className="empty-state"><div className="big">✅</div><p>Nenhuma taxa pendente</p></div> : (
                                                    <>
                                                        <div className="alerta-revisao" style={{ marginBottom: '12px' }}>
                                                            Confira: se algo aqui <b>não é taxa bancária</b>, toque em "Não é taxa" — ele volta para as saídas comuns e você cria a conta certa.
                                                        </div>
                                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px', flexWrap: 'wrap', gap: '8px' }}>
                                                            <span style={{ fontSize: '12.5px', fontWeight: 700, color: 'var(--texto-sec)' }}>
                                                                Total: R$ {fmtValor(pendencias.taxas.reduce((s, m) => s + Math.abs(m.valor), 0))}
                                                            </span>
                                                            <button className="btn-sm primary" onClick={gerarContasTaxasAgora}>🏷️ Criar contas das taxas</button>
                                                        </div>
                                                        {pendencias.taxas.map((m) => (
                                                            <div key={m.id} className="hist-row">
                                                                <div style={{ width: '58px', fontWeight: 700, fontSize: '12px', whiteSpace: 'nowrap' }}>{fmtData(m.data)}</div>
                                                                <div className="hist-mes" style={{ textTransform: 'none', fontSize: '12.5px', fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.descricao}</div>
                                                                <div className="hist-val vermelho" style={{ width: '92px', textAlign: 'right' }}>−R$ {fmtValor(Math.abs(m.valor))}</div>
                                                                <div style={{ width: '110px', textAlign: 'right' }}>
                                                                    <button className="btn-sm" style={{ padding: '6px 11px', fontSize: '11px' }} onClick={() => alternarTaxaMov(m)}>↩️ Não é taxa</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </>
                                                )
                                            )}

                                            {/* Contas pagas sem movimento no extrato */}
                                            {filtroPend === 'contas' && (
                                                pendencias.contasSemExtrato.length === 0 ? <div className="empty-state"><div className="big">✅</div><p>Todas as contas pagas batem com o extrato</p></div> : (
                                                    <>
                                                        <p style={{ fontSize: '11.5px', color: 'var(--texto-sec)', fontWeight: 600, marginBottom: '10px' }}>
                                                            Paga por outra conta/dinheiro, data errada, ou extrato do período não importado.
                                                        </p>
                                                        {pendencias.contasSemExtrato.map((c) => (
                                                            <div key={c.id} className="hist-row">
                                                                <div style={{ width: '58px', fontWeight: 700, fontSize: '12px', whiteSpace: 'nowrap' }}>{fmtData(c.pagaEm || c.vencimento)}</div>
                                                                <div className="hist-mes" style={{ textTransform: 'none', fontSize: '12.5px', fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                                                                    {tipoInfo(c.tipo) ? tipoInfo(c.tipo).emoji + ' ' : ''}{c.fornecedor}
                                                                </div>
                                                                <div className="hist-val verde" style={{ width: '92px', textAlign: 'right' }}>R$ {fmtValor(valorEfetivo(c))}</div>
                                                                <div style={{ width: '90px', textAlign: 'right', display: 'flex', gap: '5px', justifyContent: 'flex-end' }}>
                                                                    <button className="icon-btn" style={{ width: '28px', height: '28px', fontSize: '12px' }} title="Editar" onClick={() => abrirEdicao(c)}>✏️</button>
                                                                    <button className="icon-btn" style={{ width: '28px', height: '28px', fontSize: '12px' }} title="Desfazer pagamento" onClick={() => desfazerPagamento(c)}>↩️</button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </>
                                                )
                                            )}

                                            {/* Contas sem identificação */}
                                            {filtroPend === 'tipos' && (
                                                pendencias.contasSemTipo.length === 0 ? <div className="empty-state"><div className="big">✅</div><p>Todas as contas identificadas</p></div> : (
                                                    <>
                                                        <p style={{ fontSize: '11.5px', color: 'var(--texto-sec)', fontWeight: 600, marginBottom: '10px' }}>

                                                        </p>
                                                        {pendencias.contasSemTipo.slice(0, 40).map((c) => (
                                                            <div key={c.id} className="hist-row">
                                                                <div style={{ width: '58px', fontWeight: 700, fontSize: '12px', whiteSpace: 'nowrap' }}>{fmtData(c.vencimento)}</div>
                                                                <div className="hist-mes" style={{ textTransform: 'none', fontSize: '12.5px', fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.fornecedor}</div>
                                                                <div className="hist-val" style={{ width: '82px', textAlign: 'right' }}>R$ {fmtValor(c.valor)}</div>
                                                                <div style={{ width: '160px', textAlign: 'right' }}>
                                                                    <select className="cat-select" style={{ maxWidth: '155px' }} defaultValue="" onChange={(e) => {
                                                                        if (!e.target.value) return;
                                                                        const t = e.target.value;
                                                                        setContas((prev) => ({ ...prev, salvia: (prev.salvia || []).map((x) => (x.id === c.id ? { ...x, tipo: t } : x)) }));
                                                                        mostrarToast('🏪 Identificação definida');
                                                                    }}>
                                                                        <option value="">Identificar…</option>
                                                                        {TIPOS_CONTA.map((t) => <option key={t.id} value={t.id}>{t.emoji} {t.label}</option>)}
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </>
                                                )
                                            )}
                                        </>
                                    )}
                                </div>
                            </>
                        )}

                        {/* ══════════ RELATÓRIOS ══════════ */}
                        {aba === 'relatorios' && (
                            <>
                                <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: '12px' }}>
                                    <button className="btn-sm primary" onClick={atualizarTudo}>🔄 Atualizar valores</button>
                                </div>
                                <div className="rel-menu">
                                    {RELATORIOS.map((r) => (
                                        <button key={r.id} className={relAtivo === r.id ? 'active' : ''} onClick={() => setRelAtivo(r.id)}>
                                            <span className="r-ico">{r.ico}</span>
                                            {r.label}
                                        </button>
                                    ))}
                                </div>

                                {/* Histórico mensal */}
                                {relAtivo === 'mensal' && (
                                    <div className="data-section">
                                        <div className="section-header">
                                            <h3>🗓️ Histórico mensal</h3>
                                            {historicoMensal.length > 0 && (
                                                <button className="btn-sm primary" onClick={() => {
                                                    const dados = historicoMensal.map(([chave, d]) => {
                                                        const [a, mm] = chave.split('-').map(Number);
                                                        return {
                                                            'Mês': new Date(a, mm - 1, 1).toLocaleString('pt-BR', { month: 'long', year: 'numeric' }),
                                                            'Contas': d.qtd,
                                                            'Pago': arred(d.pago),
                                                            'A pagar': arred(d.pendente),
                                                            'Juros': arred(d.juros),
                                                        };
                                                    });
                                                    const ws = XLSX.utils.json_to_sheet(dados);
                                                    ws['!cols'] = [{ wch: 20 }, { wch: 9 }, { wch: 13 }, { wch: 13 }, { wch: 11 }];
                                                    const wb = XLSX.utils.book_new();
                                                    XLSX.utils.book_append_sheet(wb, ws, 'Histórico');
                                                    XLSX.writeFile(wb, `Relatorio-Historico-${nomeEmpresa}.xlsx`);
                                                    mostrarToast('📊 Relatório exportado');
                                                }}>📊 Exportar</button>
                                            )}
                                        </div>
                                        {historicoMensal.length === 0 ? (
                                            <div className="empty-state"><div className="big">🗓️</div><p>Sem histórico ainda</p></div>
                                        ) : (
                                            <>
                                                <div className="hist-row" style={{ fontWeight: 800, fontSize: '11px', color: 'var(--texto-sec)', textTransform: 'uppercase', letterSpacing: '0.4px' }}>
                                                    <div className="hist-mes">Mês</div>
                                                    <div className="hist-val" style={{ width: '92px', textAlign: 'right' }}>Pago</div>
                                                    <div className="hist-val" style={{ width: '92px', textAlign: 'right' }}>A pagar</div>
                                                    <div className="hist-val" style={{ width: '80px', textAlign: 'right' }}>Juros</div>
                                                    <div style={{ width: '54px' }}></div>
                                                </div>
                                                {historicoMensal.map(([chave, dados]) => {
                                                    const [a, m] = chave.split('-').map(Number);
                                                    const d = new Date(a, m - 1, 1);
                                                    const aberto = mesHistAberto === chave;
                                                    const contasDesteMes = aberto
                                                        ? contasEmpresa.filter((c) => (paraISO(c.vencimento) || '').slice(0, 7) === chave)
                                                            .sort((x, y) => (paraISO(x.vencimento) || '').localeCompare(paraISO(y.vencimento) || ''))
                                                        : [];
                                                    return (
                                                        <div key={chave}>
                                                            <div className="hist-row" style={{ cursor: 'pointer' }} onClick={() => setMesHistAberto(aberto ? null : chave)} title="Tocar para ver as contas">
                                                                <div className="hist-mes">{aberto ? '▾' : '▸'} {d.toLocaleString('pt-BR', { month: 'long', year: 'numeric' })} <span style={{ fontWeight: 600, color: 'var(--texto-sec)', fontSize: '11px' }}>({dados.qtd})</span></div>

                                                                <div className="hist-val vermelho" style={{ width: '80px', textAlign: 'right' }}>{dados.juros > 0 ? 'R$ ' + fmtValor(dados.juros) : '—'}</div>

                                                                    <button className="btn-sm" style={{ padding: '6px 11px', fontSize: '11px' }} onClick={(e) => { e.stopPropagation(); verMes(d); }}>Ver</button>

                                                                    {contasDesteMes.map((c) => (
